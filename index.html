const Q = [

// ══════════════════════════════════════════════════════
// CORE JAVA
// ══════════════════════════════════════════════════════
{ cat:"Core Java", tag:"tag-core", q:"How is Java platform-independent? JVM vs JRE vs JDK.",
  ans:`Java source is compiled to <strong>bytecode</strong> (.class files), which is an intermediate, platform-neutral format. The <strong>JVM</strong> is platform-specific and interprets or JIT-compiles bytecode on each OS. This is why Java is considered platform-independent: you compile once and run anywhere a compatible JVM exists.<br><br><strong>JRE</strong>: Java Runtime Environment. Contains the JVM plus standard class libraries and runtime files needed to execute Java apps.<br><strong>JDK</strong>: Java Development Kit. Includes the JRE, the Java compiler (<code>javac</code>), debugger, and development tools. Use the JDK to build Java programs; use the JRE to run them.<br><br>Key point: Java is not native machine code. It is compiled to bytecode, and the JVM makes the code portable across operating systems by providing a consistent runtime environment.` },

{ cat:"Core Java", tag:"tag-core", q:"What is a ClassLoader? ClassNotFoundException vs NoClassDefFoundError.",
  ans:`A <strong>ClassLoader</strong> is responsible for loading Java classes into the JVM at runtime. Java uses a delegation model: Bootstrap loads core JDK classes, Extension loads optional libraries, and Application loads application classes from the classpath. Custom classloaders can load classes from JARs, network locations, or other sources.<br><br><strong>ClassNotFoundException</strong>: Checked exception thrown when code explicitly tries to load a class by name (for example, <code>Class.forName("com.app.Foo")</code>) and the class is not found on the runtime classpath.<br><strong>NoClassDefFoundError</strong>: Error thrown when a class was available at compile time and compiled successfully, but is unavailable at runtime when the JVM tries to initialize or link it. Common causes include missing JARs, different runtime classpaths, or classloader conflicts.` },

{ cat:"Core Java", tag:"tag-core", q:"String Pool and intern(). When does == work for Strings?",
  ans:`String literals and compile-time constant expressions are stored in the <strong>String Pool</strong> inside the heap. If two literals are identical, they refer to the same pooled object. Example: <code>String a = "hello";</code> and <code>String b = "hello";</code> both point to the same interned instance.<br><br><code>String b = new String("hello");</code> creates a distinct object on the heap. So <code>a == b</code> is false because it compares references, while <code>a.equals(b)</code> is true because it compares content.<br><br><code>intern()</code> returns the pool instance for the string; if the string is not already pooled, it is added. After <code>b.intern()</code>, <code>a == b.intern()</code> becomes true.<br><br>Use <code>==</code> only for reference equality or when you explicitly want pooled strings. For content equality, always use <code>equals()</code>.` },

{ cat:"Core Java", tag:"tag-core", q:"HashMap internals, threshold, and collision resolution.",
  ans:`Array of Node&lt;&gt; buckets. Key's <code>hashCode()</code> determines bucket index via <code>hash & (capacity-1)</code>.<br><strong>Collision</strong>: Linked list at that bucket. Java 8+: Converts to Red-Black Tree when bucket size ≥ 8 (TREEIFY_THRESHOLD).<br><strong>Default capacity</strong>: 16. <strong>Load factor</strong>: 0.75. Resize when size &gt; 16 × 0.75 = 12 entries (rehash doubles capacity).<br><strong>Null key</strong>: One allowed (index 0). ConcurrentHashMap does NOT allow null keys.`,
  code:`Map<String,Integer> map = new HashMap<>(); // capacity=16, LF=0.75
// At 13 entries → internal array resizes to 32 (rehash all entries)` },

{ cat:"Core Java", tag:"tag-core", q:"ArrayList vs Vector — default capacity and growth strategy.",
  ans:`<strong>ArrayList</strong>: Default capacity 10. Grows by 50% (<code>oldSize + oldSize/2</code>). Not synchronized.<br><strong>Vector</strong>: Default capacity 10. Doubles on resize. All methods synchronized → thread-safe but slow.<br><br>Prefer ArrayList for single-threaded. For thread-safety use <code>CopyOnWriteArrayList</code> or <code>Collections.synchronizedList()</code>.` },

{ cat:"Core Java", tag:"tag-core", q:"equals() and hashCode() contract — why override both together?",
  ans:`<strong>Contract</strong>: If <code>a.equals(b)</code> → <code>a.hashCode() == b.hashCode()</code> MUST hold.<br>Reverse: same hashCode doesn't guarantee equals (collision is normal).<br><br>If you override equals but not hashCode → HashMap/HashSet will store duplicates or fail to find objects. Always override both.` },

{ cat:"Core Java", tag:"tag-core", q:"Fail-fast vs Fail-safe iterators.",
  ans:`<strong>Fail-fast</strong> (ArrayList, HashMap): Throws <code>ConcurrentModificationException</code> if collection is structurally modified during iteration. Uses internal <code>modCount</code> check.<br><strong>Fail-safe</strong> (CopyOnWriteArrayList, ConcurrentHashMap): Iterates over a snapshot. No exception but may not reflect latest changes.` },

{ cat:"Core Java", tag:"tag-core", q:"How to create an immutable class in Java?",
  ans:`Rules: (1) Declare class <code>final</code>. (2) All fields <code>private final</code>. (3) No setters. (4) Initialize in constructor. (5) For mutable fields (List, Date) — store defensive copies; return unmodifiable views.`,
  code:`public final class Money {
    private final int amount;
    private final List<String> tags;

    public Money(int amount, List<String> tags) {
        this.amount = amount;
        this.tags = List.copyOf(tags);           // defensive copy on store
    }
    public int getAmount() { return amount; }
    public List<String> getTags() {
        return Collections.unmodifiableList(tags); // defensive copy on return
    }
}` },

{ cat:"Core Java", tag:"tag-core", q:"Sealed Classes (Java 17) — purpose and usage.",
  ans:`Restrict which classes can extend/implement a type. Enables exhaustive pattern matching in switch expressions.`,
  code:`public sealed class Shape permits Circle, Rectangle, Triangle {}
public final class Circle    extends Shape { double radius; }
public non-sealed class Rectangle extends Shape { double w, h; }
public final class Triangle  extends Shape { double base, h; }

// Exhaustive switch — compiler enforces all cases covered
double area = switch (shape) {
    case Circle c    -> Math.PI * c.radius * c.radius;
    case Rectangle r -> r.w * r.h;
    case Triangle t  -> 0.5 * t.base * t.h;
};` },

{ cat:"Core Java", tag:"tag-core", q:"Private constructor — when and why use it?",
  ans:`(1) <strong>Singleton</strong>: Prevent external instantiation, force use of <code>getInstance()</code>.<br>(2) <strong>Utility classes</strong> (like Math, Collections): All static methods, instantiation makes no sense.<br>(3) <strong>Factory methods</strong>: Control object creation — choose concrete type based on params.<br>(4) <strong>Builder pattern</strong>: Force callers to use the builder.` },

{ cat:"Core Java", tag:"tag-core", q:"Checked vs Unchecked exceptions. Try-with-resources.",
  ans:`<strong>Checked</strong> (extends Exception): Compiler forces catch or declare. IOException, SQLException.<br><strong>Unchecked</strong> (extends RuntimeException): Optional. NullPointerException, IllegalArgumentException.<br><strong>Error</strong>: JVM-level, never catch. OutOfMemoryError, StackOverflowError.<br><strong>Try-with-resources</strong>: Auto-closes any <code>AutoCloseable</code> — cleaner than finally blocks.`,
  code:`try (var reader = new BufferedReader(new FileReader("file.txt"));
     var conn   = dataSource.getConnection()) {
    return reader.readLine();
} // Both closed automatically even on exception` },

{ cat:"Core Java", tag:"tag-core", q:"AutoBoxing — what it is and its pitfalls.",
  ans:`Auto-conversion between primitives and wrappers. <code>Integer i = 5</code> → <code>Integer.valueOf(5)</code>. <code>int x = i</code> → <code>i.intValue()</code>.<br><strong>Pitfalls</strong>: (1) NPE when unboxing null Integer to int. (2) <code>==</code> on Integer compares refs — cached only for -128 to 127. (3) Loop performance: boxing in tight loops creates garbage.`,
  code:`Integer a = 127, b = 127; System.out.println(a == b); // true  (cached)
Integer c = 128, d = 128; System.out.println(c == d); // false (new objects)
// Rule: always use .equals() for Integer/Long/etc comparison` },

{ cat:"Core Java", tag:"tag-core", q:"BigDecimal vs double for financial data.",
  ans:`<code>double</code> uses binary floating point → precision loss: <code>0.1 + 0.2 = 0.30000000000000004</code>. Never use for money/tax.<br><code>BigDecimal</code>: Arbitrary precision. Construct from String, not double (<code>new BigDecimal(0.1)</code> still has the error).`,
  code:`BigDecimal price = new BigDecimal("19.99");
BigDecimal tax   = new BigDecimal("0.18");
BigDecimal total = price.multiply(BigDecimal.ONE.add(tax))
                        .setScale(2, RoundingMode.HALF_UP);
System.out.println(total); // 23.59` },

// ══════════════════════════════════════════════════════
// JVM MEMORY
// ══════════════════════════════════════════════════════
{ cat:"JVM Memory", tag:"tag-jvm", q:"JVM memory areas — Heap, Stack, Metaspace, etc.",
  ans:`<strong>Heap</strong>: Objects + instances. GC-managed. Young Gen (Eden, S0, S1) + Old Gen.<br><strong>Stack</strong>: Per-thread. Stack frames hold local vars, operand stack, method refs. LIFO.<br><strong>Metaspace</strong> (Java 8+): Class metadata, static fields, bytecode in native memory (replaced PermGen).<br><strong>PC Register</strong>: Current bytecode instruction pointer per thread.<br><strong>Native Method Stack</strong>: For JNI native calls.` },

{ cat:"JVM Memory", tag:"tag-jvm", q:"Garbage Collection — how does it work? GC algorithms.",
  ans:`<strong>Mark → Sweep → Compact</strong>: Mark live objects → free dead → compact to remove fragmentation.<br><strong>Minor GC</strong>: Eden fills → live objects moved to Survivor (S0↔S1) → after N cycles promoted to Old Gen.<br><strong>Major/Full GC</strong>: Old Gen collection. Slower, Stop-The-World pause.<br><br><strong>GC Algorithms</strong>:<br>• <strong>Serial GC</strong>: Single thread, small apps.<br>• <strong>Parallel GC</strong>: Multi-thread, throughput focus.<br>• <strong>G1 GC</strong>: Default Java 9+. Region-based, predictable pause targets.<br>• <strong>ZGC / Shenandoah</strong>: Sub-millisecond pauses for large heaps.` },

{ cat:"JVM Memory", tag:"tag-jvm", q:"Strong, Weak, Soft, Phantom references — when to use each.",
  ans:`<strong>Strong</strong>: Normal reference. GC never collects while reachable.<br><strong>Soft</strong>: GC collects only when memory is low. Ideal for caches.<br><strong>Weak</strong>: GC collects at next cycle if only weakly reachable. Used in WeakHashMap — entries auto-removed when key has no strong ref.<br><strong>Phantom</strong>: Post-finalization cleanup via ReferenceQueue. Better alternative to finalize().` },

{ cat:"JVM Memory", tag:"tag-jvm", q:"How to debug OutOfMemoryError and memory leaks.",
  ans:`<strong>Common OOM types</strong>: Java heap space (objects accumulate), GC overhead limit exceeded, Metaspace (too many classes).<br><br><strong>Debug steps</strong>:<br>1. Enable heap dump: <code>-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/dump.hprof</code><br>2. Analyze with <strong>Eclipse MAT</strong> or <strong>VisualVM</strong> — look at Retained Heap.<br>3. <strong>Common leak patterns</strong>: static collections growing unbounded, unclosed streams/connections, listeners not deregistered, ThreadLocal not cleared in thread pools.`,
  code:`# JVM flags to add to startup
-Xms512m -Xmx2g
-XX:+HeapDumpOnOutOfMemoryError
-XX:HeapDumpPath=/tmp/app-heap.hprof
-verbose:gc -Xlog:gc*:file=/tmp/gc.log` },

{ cat:"JVM Memory", tag:"tag-jvm", q:"PermGen vs Metaspace — why was Metaspace introduced?",
  ans:`<strong>PermGen</strong> (Java ≤ 7): Fixed-size region (-XX:MaxPermSize). Stored class metadata + interned strings. Frequent OOM in apps with many classes (OSGi, heavy reflection, dynamic proxies).<br><strong>Metaspace</strong> (Java 8+): Uses native OS memory. Grows dynamically. Interned strings moved to main heap. No more PermGen OOM — but set limit to prevent unbounded growth: <code>-XX:MaxMetaspaceSize=256m</code>.` },

{ cat:"JVM Memory", tag:"tag-jvm", q:"What is Escape Analysis? How does JVM use it to optimize?",
  ans:`JVM analyzes whether an object can <em>escape</em> the method (returned, stored globally, passed to another thread). If it doesn't escape:<br>(1) <strong>Stack allocation</strong>: Allocate on stack instead of heap — no GC needed.<br>(2) <strong>Scalar replacement</strong>: Decompose object into primitive fields.<br>(3) <strong>Lock elision</strong>: Remove synchronization on non-shared objects.<br><br>Enabled by default since Java 7. Significantly reduces GC pressure for short-lived objects.` },

// ══════════════════════════════════════════════════════
// CONCURRENCY
// ══════════════════════════════════════════════════════
{ cat:"Concurrency", tag:"tag-conc", q:"Thread lifecycle states in Java.",
  ans:`<strong>NEW</strong> → <strong>RUNNABLE</strong> → {<strong>BLOCKED</strong> | <strong>WAITING</strong> | <strong>TIMED_WAITING</strong>} → <strong>TERMINATED</strong><br><br><strong>BLOCKED</strong>: Waiting for monitor lock held by another thread (synchronized block).<br><strong>WAITING</strong>: Indefinitely — <code>wait()</code>, <code>join()</code>, <code>LockSupport.park()</code>.<br><strong>TIMED_WAITING</strong>: Same but with timeout — <code>sleep(ms)</code>, <code>wait(ms)</code>, <code>join(ms)</code>.` },

{ cat:"Concurrency", tag:"tag-conc", q:"volatile vs synchronized vs Atomic classes.",
  ans:`<strong>volatile</strong>: Visibility only. Reads/writes go to main memory, no CPU cache. No atomicity — <code>count++</code> is still a race condition.<br><strong>synchronized</strong>: Mutual exclusion + visibility. Heavier, involves OS-level locking.<br><strong>Atomic classes</strong>: Lock-free using CAS (Compare-And-Swap). Best for counters, flags, references.`,
  code:`// volatile: simple flag visible to all threads
private volatile boolean running = true;

// synchronized: atomic read-modify-write
synchronized (this) { counter++; }

// AtomicInteger: lock-free, highest performance for single-variable ops
AtomicInteger count = new AtomicInteger(0);
int prev = count.getAndIncrement();  // atomic; no lock
count.compareAndSet(expected, newValue);` },

{ cat:"Concurrency", tag:"tag-conc", q:"ExecutorService types — when to use which?",
  ans:`<strong>newFixedThreadPool(n)</strong>: Fixed n threads, unbounded LinkedBlockingQueue. Good for known workloads.<br><strong>newCachedThreadPool()</strong>: Unlimited threads, 60s idle timeout. Risky — can exhaust system under burst.<br><strong>newSingleThreadExecutor()</strong>: 1 thread, ordered execution.<br><strong>newScheduledThreadPool(n)</strong>: Cron-like scheduling.<br><br><strong>Best practice</strong>: Use <code>ThreadPoolExecutor</code> directly for full control — set bounded queue + rejection policy to apply backpressure.`,
  code:`ThreadPoolExecutor executor = new ThreadPoolExecutor(
    10, 50,                                   // core, max threads
    60L, TimeUnit.SECONDS,                    // idle thread timeout
    new ArrayBlockingQueue<>(1000),           // bounded queue (backpressure!)
    new ThreadPoolExecutor.CallerRunsPolicy() // slow submitter when full
);` },

{ cat:"Concurrency", tag:"tag-conc", q:"Deadlock — causes, detection, and prevention.",
  ans:`<strong>Deadlock</strong>: Thread A holds Lock 1, waits for Lock 2. Thread B holds Lock 2, waits for Lock 1. Circular wait.<br><strong>Detection</strong>: <code>jstack &lt;PID&gt;</code> or VisualVM → shows BLOCKED threads with cycle.<br><strong>Prevention strategies</strong>:<br>(1) Always acquire locks in a consistent global order.<br>(2) Use <code>tryLock(timeout)</code> and back off on failure.<br>(3) Prefer higher-level concurrency (ConcurrentHashMap, BlockingQueue) over manual locking.`,
  code:`ReentrantLock lockA = new ReentrantLock();
ReentrantLock lockB = new ReentrantLock();

if (lockA.tryLock(1, TimeUnit.SECONDS)) {
    try {
        if (lockB.tryLock(1, TimeUnit.SECONDS)) {
            try { /* safe critical section */ }
            finally { lockB.unlock(); }
        }
    } finally { lockA.unlock(); }
}` },

{ cat:"Concurrency", tag:"tag-conc", q:"CompletableFuture — composition and error handling.",
  ans:`Non-blocking, composable async computation. Replaces Future's blocking <code>get()</code>.`,
  code:`CompletableFuture<Order> result = CompletableFuture
    .supplyAsync(() -> userService.findUser(userId))   // async, runs in ForkJoinPool
    .thenApply(user -> enrichUser(user))                // sync transform
    .thenCompose(user -> orderService.getOrders(user))  // flatMap (returns CF)
    .exceptionally(ex -> Order.empty());                // fallback on error

// Combine multiple futures
CompletableFuture.allOf(f1, f2, f3)
    .thenRun(() -> System.out.println("all done"));

CompletableFuture.anyOf(f1, f2)
    .thenAccept(first -> System.out.println("fastest: " + first));` },

{ cat:"Concurrency", tag:"tag-conc", q:"ConcurrentHashMap internals. Why no null keys?",
  ans:`Java 8+: Array of Node + CAS operations for lock-free reads. Synchronized on individual bucket heads (not entire map) for writes — high concurrency.<br><br><strong>No null keys/values</strong>: In concurrent context, <code>map.get(key) == null</code> is ambiguous — absent key OR null value stored? This ambiguity is eliminated by disallowing null. HashMap allows 1 null key since it's single-threaded.` },

// ══════════════════════════════════════════════════════
// STREAMS & FP
// ══════════════════════════════════════════════════════
{ cat:"Streams & FP", tag:"tag-streams", q:"Streams API — lazy evaluation, intermediate vs terminal operations.",
  ans:`Streams are lazy sequences supporting functional-style ops. Not a data structure — pipeline executes only when a terminal operation is called.<br><br><strong>Intermediate</strong> (lazy, return Stream): filter, map, flatMap, distinct, sorted, limit, skip, peek.<br><strong>Terminal</strong> (eager, triggers pipeline): collect, forEach, reduce, count, findFirst, anyMatch, min, max.<br><br>Short-circuit ops (findFirst, anyMatch, limit) stop processing as soon as the answer is known.` },

{ cat:"Streams & FP", tag:"tag-streams", q:"map() vs flatMap() — with examples.",
  ans:`<strong>map()</strong>: 1-to-1 transform. If mapper returns a collection → you get Stream&lt;List&lt;T&gt;&gt; (still nested).<br><strong>flatMap()</strong>: 1-to-many then flattens → Stream&lt;T&gt;.`,
  code:`List<List<Integer>> nested = List.of(List.of(1, 2), List.of(3, 4));

// map → Stream<List<Integer>> (nested, probably not what you want)
nested.stream().map(l -> l.stream());

// flatMap → Stream<Integer> (flattened)
List<Integer> flat = nested.stream()
    .flatMap(Collection::stream)
    .collect(Collectors.toList()); // [1, 2, 3, 4]

// Real-world: get all tags from all posts
List<String> tags = posts.stream()
    .flatMap(post -> post.getTags().stream())
    .distinct()
    .collect(Collectors.toList());` },

{ cat:"Streams & FP", tag:"tag-streams", q:"Find 2nd highest salary using Stream API.",
  ans:`Get the distinct salaries, sort them highest-first, skip the top salary, and then pick the first remaining value. This avoids returning the same salary twice when there are duplicates.`,
  code:`// Using distinct + sorted
Optional<Integer> secondHighest = employees.stream()
    .map(Employee::getSalary)
    .distinct()
    .sorted(Comparator.reverseOrder())
    .skip(1)
    .findFirst();

secondHighest.ifPresentOrElse(
    s -> System.out.println("2nd highest salary: " + s),
    () -> System.out.println("Not enough distinct salaries")
);` },

{ cat:"Streams & FP", tag:"tag-streams", q:"Find duplicates in a list / filter by length / group by department.",
  ans:`Use stream operations to express common data transformations concisely. Detect duplicates by tracking seen elements, filter collections with <code>filter()</code>, and aggregate elements by keys using <code>Collectors.groupingBy()</code>. For numeric aggregation, use downstream collectors like <code>averagingInt()</code>.`,
  code:`List<String> list = List.of("a", "b", "a", "c", "b", "b");

// 1. Find duplicates
Set<String> seen = new HashSet<>();
Set<String> duplicates = list.stream()
    .filter(e -> !seen.add(e))      // add() returns false for duplicates
    .collect(Collectors.toSet());   // {a, b}

// 2. Filter strings with length > 4
List<String> long_words = words.stream()
    .filter(s -> s.length() > 4)
    .collect(Collectors.toList());

// 3. Group employees by department
Map<String, List<Employee>> byDept = employees.stream()
    .collect(Collectors.groupingBy(Employee::getDepartment));

// 4. Average salary per department
Map<String, Double> avgSalary = employees.stream()
    .collect(Collectors.groupingBy(
        Employee::getDepartment,
        Collectors.averagingInt(Employee::getSalary)
    ));` },

{ cat:"Streams & FP", tag:"tag-streams", q:"When to use parallel streams? Gotchas.",
  ans:`<strong>Use parallel when</strong>: Large dataset (100k+ elements), CPU-bound ops, operations are stateless/independent, collection is easily splittable (ArrayList, arrays).<br><br><strong>Avoid parallel when</strong>: I/O-bound work (use CompletableFuture instead), small data, shared mutable state, ordered output required (use forEachOrdered — but negates speedup), LinkedList (poor splittability).` },

{ cat:"Streams & FP", tag:"tag-streams", q:"Functional interface — definition, default/static methods, common examples.",
  ans:`Exactly one abstract method. <code>@FunctionalInterface</code> annotation enforces this at compile time.<br>Can have any number of <code>default</code> and <code>static</code> methods — they don't count as abstract.<br><br><strong>Common built-in</strong>: Supplier&lt;T&gt; (get), Consumer&lt;T&gt; (accept), Function&lt;T,R&gt; (apply), Predicate&lt;T&gt; (test), BiFunction&lt;T,U,R&gt;, Runnable (run).`,
  code:`@FunctionalInterface
interface Transformer<T, R> {
    R transform(T input);            // single abstract method → lambda target
    default void log(T input) { System.out.println("Input: " + input); }
    static <T> Transformer<T,T> identity() { return t -> t; }
}

// Use as lambda
Transformer<String, Integer> len = String::length;
System.out.println(len.transform("hello")); // 5` },

// ══════════════════════════════════════════════════════
// SPRING BOOT
// ══════════════════════════════════════════════════════
{ cat:"Spring Boot", tag:"tag-spring", q:"Auto-configuration — how does Spring Boot wire itself?",
  ans:`<code>@SpringBootApplication</code> = <code>@Configuration</code> + <code>@EnableAutoConfiguration</code> + <code>@ComponentScan</code>.<br><br><code>@EnableAutoConfiguration</code> loads all AutoConfiguration classes listed in <code>META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports</code> (Spring Boot 3+).<br><br>Each auto-config uses conditional annotations to decide whether to activate:<br>• <code>@ConditionalOnClass</code>: Only if library is on classpath.<br>• <code>@ConditionalOnMissingBean</code>: Only if you haven't defined your own bean.<br>• <code>@ConditionalOnProperty</code>: Only if a property is set.<br><br>Result: Add spring-boot-starter-data-jpa → DataSource, EntityManagerFactory, TransactionManager auto-configured from <code>application.properties</code>.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"Bean lifecycle. @PostConstruct and @PreDestroy.",
  ans:`Order: Instantiate → Inject dependencies → <code>@PostConstruct</code> (init) → Bean in use → <code>@PreDestroy</code> (destroy) → Garbage collected.`,
  code:`@Component
public class CacheService {
    @Autowired
    private RedisTemplate<String, Object> redis;

    @PostConstruct
    public void warmUp() {
        // Called after all dependencies injected — safe to use them here
        redis.opsForValue().set("startup", "true");
    }

    @PreDestroy
    public void flush() {
        // Called before bean destroyed — clean up resources
        redis.getConnectionFactory().getConnection().close();
    }
}` },

{ cat:"Spring Boot", tag:"tag-spring", q:"@Transactional internals. Propagation types. The self-invocation trap.",
  ans:`Spring wraps the bean in a <strong>proxy</strong>. Proxy intercepts the call → begins transaction → runs method → commit/rollback. The actual bean object has no transaction logic.<br><br><strong>Propagation types</strong>:<br>• <strong>REQUIRED</strong> (default): Join existing or create new.<br>• <strong>REQUIRES_NEW</strong>: Suspend existing, always new transaction.<br>• <strong>NESTED</strong>: Savepoint within current transaction.<br>• <strong>SUPPORTS</strong>: Use existing if present; non-transactional otherwise.<br><br><strong>Self-invocation trap</strong>: Calling a @Transactional method from within the same class bypasses the proxy → transaction won't start. Fix: inject self or use AspectJ weaving.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"Global exception handling — @ControllerAdvice vs @ExceptionHandler.",
  ans:`<code>@ControllerAdvice</code> or <code>@RestControllerAdvice</code> registers a global exception handler across controllers. <code>@ExceptionHandler</code> methods inside it handle specific exception types and allow you to return structured error responses in one centralized location. This helps avoid repetitive try/catch logic in controllers and keeps API error handling consistent.`,
  code:`@RestControllerAdvice
public class GlobalExceptionHandler {

    @ExceptionHandler(ResourceNotFoundException.class)
    @ResponseStatus(HttpStatus.NOT_FOUND)
    public ErrorResponse handleNotFound(ResourceNotFoundException ex, HttpServletRequest req) {
        return ErrorResponse.of(404, ex.getMessage(), req.getRequestURI());
    }

    @ExceptionHandler(ConstraintViolationException.class)
    @ResponseStatus(HttpStatus.BAD_REQUEST)
    public ErrorResponse handleValidation(ConstraintViolationException ex) {
        String msg = ex.getConstraintViolations().stream()
            .map(v -> v.getPropertyPath() + ": " + v.getMessage())
            .collect(Collectors.joining(", "));
        return ErrorResponse.of(400, msg, null);
    }

    @ExceptionHandler(Exception.class)
    @ResponseStatus(HttpStatus.INTERNAL_SERVER_ERROR)
    public ErrorResponse handleAll(Exception ex) {
        log.error("Unhandled exception", ex);
        return ErrorResponse.of(500, "Internal server error", null);
    }
}` },

{ cat:"Spring Boot", tag:"tag-spring", q:"@Async internals. How to configure a proper thread pool for it.",
  ans:`@Async proxies the method call and submits it to a TaskExecutor. Default is <code>SimpleAsyncTaskExecutor</code> which creates a new thread per call — never use in production.<br><br>Must have <code>@EnableAsync</code> on a config class. Same proxy rule as @Transactional: must call from outside the class, method must be public.`,
  code:`@Configuration
@EnableAsync
public class AsyncConfig implements AsyncConfigurer {

    @Override
    public Executor getAsyncExecutor() {
        ThreadPoolTaskExecutor exec = new ThreadPoolTaskExecutor();
        exec.setCorePoolSize(10);
        exec.setMaxPoolSize(50);
        exec.setQueueCapacity(500);
        exec.setThreadNamePrefix("async-");
        exec.setRejectedExecutionHandler(new ThreadPoolExecutor.CallerRunsPolicy());
        exec.initialize();
        return exec;
    }
}

@Service
public class EmailService {
    @Async
    public CompletableFuture<Boolean> sendEmail(String to) {
        // Runs in async thread pool
        emailClient.send(to);
        return CompletableFuture.completedFuture(true);
    }
}` },

{ cat:"Spring Boot", tag:"tag-spring", q:"WebClient vs RestTemplate vs Feign Client — choose which?",
  ans:`<strong>RestTemplate</strong>: Synchronous, blocking. In maintenance mode (won't get new features). Simple and familiar.<br><strong>WebClient</strong>: Reactive, non-blocking. Works in both reactive (WebFlux) and traditional (MVC) stacks. Supports streaming. Preferred for new code.<br><strong>Feign Client</strong>: Declarative — define an interface with annotations, Spring generates the implementation. Integrates with service discovery, load balancing, circuit breaker out of the box.`,
  code:`// WebClient (reactive, non-blocking)
webClient.get()
    .uri("/users/{id}", userId)
    .retrieve()
    .bodyToMono(User.class)
    .timeout(Duration.ofSeconds(3))
    .onErrorReturn(User.defaultUser());

// Feign (declarative — recommended for microservices)
@FeignClient(name = "user-service", fallback = UserClientFallback.class)
public interface UserClient {
    @GetMapping("/users/{id}")
    User getUser(@PathVariable("id") Long id);
}` },

// ══════════════════════════════════════════════════════
// JPA / HIBERNATE
// ══════════════════════════════════════════════════════
{ cat:"JPA / Hibernate", tag:"tag-jpa", q:"JPA vs Hibernate. What is the persistence context?",
  ans:`<strong>JPA</strong>: Java specification (jakarta.persistence). Defines API, JPQL, annotations. Not an implementation.<br><strong>Hibernate</strong>: Most popular JPA implementation. Also has its own native API (Session, HQL).<br><br><strong>Persistence context</strong>: First-level cache — a unit-of-work scoped to the current transaction. All managed entities are tracked here. Hibernate syncs changes to DB on flush.` },

{ cat:"JPA / Hibernate", tag:"tag-jpa", q:"Entity lifecycle: Transient, Managed, Detached, Removed.",
  ans:`<strong>Transient</strong>: New object. No DB row, not in persistence context.<br><strong>Managed</strong>: In persistence context. Dirty checking active — changes auto-saved on flush.<br><strong>Detached</strong>: Context was closed or entity was evicted. DB row exists but changes NOT tracked. Call <code>merge()</code> to re-attach.<br><strong>Removed</strong>: Scheduled for DELETE. Executed on flush/commit.` },

{ cat:"JPA / Hibernate", tag:"tag-jpa", q:"N+1 query problem — what it is and how to fix it.",
  ans:`<strong>Problem</strong>: Query 1 fetches N orders → Hibernate fires N separate queries to load each order's customer. Total: N+1 queries.<br><br><strong>Solutions</strong>:<br>(1) JOIN FETCH in JPQL — single query loads both.<br>(2) @EntityGraph — declarative, avoids modifying query.<br>(3) @BatchSize — fetch in batches of N.<br>(4) DTO projection — select only needed columns in one query.`,
  code:`// 1. JOIN FETCH
@Query("SELECT o FROM Order o JOIN FETCH o.customer WHERE o.status = :status")
List<Order> findByStatus(@Param("status") String status);

// 2. EntityGraph (declarative)
@EntityGraph(attributePaths = {"customer", "items"})
List<Order> findByStatus(String status);

// 3. Batch fetching (global or per entity)
@Entity @BatchSize(size = 20)
public class Customer { ... }

// 4. DTO projection (most efficient for read-only views)
@Query("SELECT new com.app.OrderDTO(o.id, o.total, c.name) " +
       "FROM Order o JOIN o.customer c WHERE o.status = :status")
List<OrderDTO> findOrderSummaries(@Param("status") String status);` },

{ cat:"JPA / Hibernate", tag:"tag-jpa", q:"Optimistic vs Pessimistic locking.",
  ans:`<strong>Optimistic</strong>: No DB lock. Uses a version column. On update, checks version matches — if another transaction updated first → OptimisticLockException. Best for low-contention, read-heavy systems.<br><strong>Pessimistic</strong>: DB-level SELECT FOR UPDATE lock. Blocks other transactions. Safer for high-contention, financial operations.`,
  code:`// Optimistic locking
@Entity
public class Product {
    @Version
    private int version;  // auto-incremented on each UPDATE; checked on write
}

// Pessimistic locking
@Lock(LockModeType.PESSIMISTIC_WRITE)
@Query("SELECT p FROM Product p WHERE p.id = :id")
Product findByIdForUpdate(@Param("id") Long id);
// Generates: SELECT ... FROM product WHERE id=? FOR UPDATE` },

{ cat:"JPA / Hibernate", tag:"tag-jpa", q:"Cascade types — when to use ALL vs specific ones?",
  ans:`<strong>CascadeType.ALL</strong>: Propagates PERSIST, MERGE, REMOVE, REFRESH, DETACH. Safe only when child has no independent lifecycle (e.g., OrderItem — meaningless without Order).<br><br><strong>Dangerous patterns</strong>: ALL on @ManyToMany or @ManyToOne — accidental REMOVE on shared entities. Prefer explicit: <code>cascade = {PERSIST, MERGE}</code> for most cases.` },

{ cat:"JPA / Hibernate", tag:"tag-jpa", q:"save() vs saveAndFlush(). Dirty checking and flush().",
  ans:`<strong>Dirty checking</strong>: Hibernate snapshots entity state on load. On flush, compares current vs snapshot → issues UPDATE automatically. No need to call save() for already-managed entities.<br><strong>save()</strong>: Returns managed entity. SQL deferred to flush time (end of transaction).<br><strong>saveAndFlush()</strong>: Forces immediate SQL flush. Use when you need the DB state visible within the same transaction (e.g., before calling a stored procedure or native query).` },

// ══════════════════════════════════════════════════════
// SYSTEM DESIGN
// ══════════════════════════════════════════════════════
{ cat:"System Design", tag:"tag-system", q:"Saga pattern — Choreography vs Orchestration.",
  ans:`<strong>Problem</strong>: Distributed transactions across microservices — no 2-phase commit. Saga = chain of local transactions with compensating transactions on failure.<br><br><strong>Choreography</strong>: Services react to events (Order created → Inventory service listens → Reserve stock → emit event → …). No central coordinator. Loosely coupled but hard to trace the overall flow.<br><strong>Orchestration</strong>: Central saga orchestrator issues commands to each service. Easier to track, visualize, and debug. Single point of failure.` },

{ cat:"System Design", tag:"tag-system", q:"Circuit Breaker pattern — states and Spring Boot implementation.",
  ans:`Prevents cascading failures when a downstream service is degraded.<br><br><strong>CLOSED</strong>: Normal operation. Failures counted.<br><strong>OPEN</strong>: Threshold exceeded → requests immediately fail (fallback returned). No calls to downstream.<br><strong>HALF-OPEN</strong>: After timeout, allow limited probe requests. If successful → CLOSED. If fail → OPEN.`,
  code:`// Resilience4j with Spring Boot
@CircuitBreaker(name = "inventoryService", fallbackMethod = "fallback")
public InventoryStatus checkInventory(Long productId) {
    return inventoryClient.getStock(productId);
}

public InventoryStatus fallback(Long productId, Exception ex) {
    log.warn("Circuit open for product {}", productId, ex);
    return InventoryStatus.UNKNOWN; // graceful degradation
}

// application.yml
resilience4j.circuitbreaker.instances.inventoryService:
  failureRateThreshold: 50        # open if 50% of last N calls fail
  slowCallRateThreshold: 80
  waitDurationInOpenState: 30s
  slidingWindowSize: 20` },

{ cat:"System Design", tag:"tag-system", q:"Idempotency — how to implement it in POST APIs.",
  ans:`Client sends a unique <code>Idempotency-Key</code> header with each request. Server stores (key → response) in Redis with TTL. On duplicate key → return cached response without re-processing.`,
  code:`@PostMapping("/payments")
public ResponseEntity<Payment> pay(
        @RequestHeader("Idempotency-Key") String key,
        @RequestBody @Valid PaymentRequest req) {

    // Check idempotency store first
    Payment cached = idempotencyStore.get(key);
    if (cached != null) {
        return ResponseEntity.ok(cached); // return same result
    }

    Payment result = paymentService.process(req);

    // Store result with 24h TTL
    idempotencyStore.put(key, result, Duration.ofHours(24));
    return ResponseEntity.status(HttpStatus.CREATED).body(result);
}` },

{ cat:"System Design", tag:"tag-system", q:"Distributed scheduler — prevent duplicate job execution across instances.",
  ans:`<strong>Problem</strong>: @Scheduled fires on ALL instances in a cluster.<br><br><strong>Options</strong>:<br>(1) <strong>ShedLock</strong>: Distributed lock in DB/Redis. One node acquires lock, others skip. Simple, Spring Boot native.<br>(2) <strong>Quartz Scheduler + JDBC JobStore</strong>: Cluster-aware, guaranteed single execution, supports misfire handling.<br>(3) <strong>Kubernetes CronJob</strong>: Run scheduler as a separate single-pod Deployment.`,
  code:`// ShedLock (simplest approach)
@Bean
public LockProvider lockProvider(DataSource dataSource) {
    return new JdbcTemplateLockProvider(dataSource);
}

@Scheduled(cron = "0 0 * * * *")
@SchedulerLock(name = "hourlyReport",
               lockAtLeastFor = "PT55M",
               lockAtMostFor = "PT1H")
public void generateReport() {
    // Only runs on one node per hour
}` },

{ cat:"System Design", tag:"tag-system", q:"How to debug slow API / high latency under load.",
  ans:`<strong>Step 1 — Identify the bottleneck</strong>:<br>• <strong>DB</strong>: Check slow query log, N+1 pattern, missing indexes (EXPLAIN plan).<br>• <strong>Thread pool exhaustion</strong>: Thread dump → many BLOCKED threads.<br>• <strong>GC pauses</strong>: Check GC logs for long STW pauses.<br>• <strong>External service</strong>: Check timeouts, circuit breaker metrics.<br><br><strong>Step 2 — Fix</strong>:<br>• Add caching (Redis) for frequently read stable data.<br>• Async processing for non-critical paths.<br>• Tune HikariCP pool size.<br>• Add pagination to unbounded queries.<br>• Optimize SQL with proper indexes.` },

// ══════════════════════════════════════════════════════
// REST & SECURITY
// ══════════════════════════════════════════════════════
{ cat:"REST & Security", tag:"tag-rest", q:"PUT vs POST vs PATCH — idempotency.",
  ans:`<strong>POST</strong>: Create. NOT idempotent (2× POST = 2 resources).<br><strong>PUT</strong>: Replace full resource. Idempotent.<br><strong>PATCH</strong>: Partial update. Not strictly idempotent (e.g., increment field) but usually treated as such.<br><strong>GET</strong>: Safe + idempotent.<br><strong>DELETE</strong>: Idempotent (deleting already-deleted → 404, state is same: resource gone).` },

{ cat:"REST & Security", tag:"tag-rest", q:"JWT authentication flow. JWT vs OAuth2.",
  ans:`<strong>JWT flow</strong>: (1) Client sends credentials. (2) Server validates, returns signed JWT (header.payload.signature, base64url). (3) Client sends JWT in <code>Authorization: Bearer &lt;token&gt;</code>. (4) Server validates signature (no DB lookup) → stateless, scalable.<br><br><strong>JWT</strong>: Token <em>format</em>. Self-contained, stateless. Can be used standalone.<br><strong>OAuth2</strong>: Authorization <em>framework/protocol</em>. Defines flows for delegated access (Authorization Code, Client Credentials, etc.). Often uses JWT as the token format.` },

// ══════════════════════════════════════════════════════
// DATABASE & SQL
// ══════════════════════════════════════════════════════
{ cat:"Database & SQL", tag:"tag-sql", q:"ACID properties and transaction isolation levels.",
  ans:`<strong>ACID</strong>: Atomicity (all or nothing), Consistency (valid state transitions), Isolation (concurrent transactions don't interfere), Durability (committed data persists on crash).<br><br><strong>Isolation levels</strong>:<br>• <strong>READ_UNCOMMITTED</strong>: Dirty reads possible.<br>• <strong>READ_COMMITTED</strong> (default PostgreSQL): Prevents dirty reads.<br>• <strong>REPEATABLE_READ</strong> (default MySQL/InnoDB): Prevents dirty + non-repeatable reads.<br>• <strong>SERIALIZABLE</strong>: Prevents all anomalies (phantom reads too). Slowest.` },

{ cat:"Database & SQL", tag:"tag-sql", q:"Indexing — selectivity, composite indexes, leftmost prefix rule.",
  ans:`<strong>Index</strong>: B-tree for fast lookup. Speeds reads, slows writes (index maintained on every write).<br><strong>Selectivity</strong>: Cardinality / total rows. High selectivity (email, user_id) → very effective. Low selectivity (is_active boolean) → optimizer may prefer full scan.<br><strong>Composite index (col1, col2)</strong>: Useful for queries filtering/sorting on both. <em>Leftmost prefix rule</em>: Query on col1 alone → uses index. Query on col2 alone → does NOT use index.` },

{ cat:"Database & SQL", tag:"tag-sql", q:"Useful SQL queries — employees hired last 30 days, percentage per department.",
  ans:`These queries show common reporting patterns: date filtering for recent hires, grouped aggregation for department metrics, and window functions for percent calculations. Use the database to answer business questions efficiently rather than fetching raw rows and processing in application code.`,
  code:`-- Employees hired in the last 30 days
SELECT employee_id, name, hire_date, department
FROM employees
WHERE hire_date >= CURRENT_DATE - INTERVAL '30 days'
ORDER BY hire_date DESC;

-- Percentage of employees per department (window function)
SELECT department,
       COUNT(*)                                          AS headcount,
       ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (), 2) AS pct
FROM employees
GROUP BY department
ORDER BY pct DESC;

-- 2nd highest salary (SQL approach)
SELECT MAX(salary) AS second_highest
FROM employees
WHERE salary < (SELECT MAX(salary) FROM employees);

-- Employees hired last 30 days count by department
SELECT department, COUNT(*) AS new_hires
FROM employees
WHERE hire_date >= CURRENT_DATE - INTERVAL '30 days'
GROUP BY department
HAVING COUNT(*) > 0;` },

{ cat:"Database & SQL", tag:"tag-sql", q:"HikariCP connection pool — tuning and exhaustion fixes.",
  ans:`<strong>Exhaustion causes</strong>: Long transactions holding connections, connection leaks (not returned), pool undersized, N+1 queries causing many queries per request.<br><strong>Fixes</strong>: Tune pool size (typically: cores × 2 + disk spindles), set connectionTimeout to fail fast, ensure connections always returned (Spring @Transactional handles this), use read replicas for read-only queries.`,
  code:`# application.properties (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000    # 30s — fail fast
spring.datasource.hikari.idle-timeout=600000         # 10min
spring.datasource.hikari.max-lifetime=1800000        # 30min (< DB wait_timeout)
spring.datasource.hikari.leak-detection-threshold=60000 # log connections open > 1min` },

// ══════════════════════════════════════════════════════
// DESIGN PATTERNS
// ══════════════════════════════════════════════════════
{ cat:"Design Patterns", tag:"tag-design", q:"Singleton — thread-safe implementations.",
  ans:`Singleton ensures only one instance exists and provides global access. In Java, correct lazy initialization requires careful use of synchronization or classloading guarantees. The initialization-on-demand holder idiom is usually preferred because it is thread-safe without synchronization overhead. Enum singletons are the simplest and also protect against serialization/deserialization and reflection attacks.`,
  code:`// Option 1: Double-checked locking (Java 5+)
public class AppConfig {
    private static volatile AppConfig instance;
    private AppConfig() {}

    public static AppConfig getInstance() {
        if (instance == null) {                  // first check (no lock)
            synchronized (AppConfig.class) {
                if (instance == null) {          // second check (with lock)
                    instance = new AppConfig();
                }
            }
        }
        return instance;
    }
}

// Option 2: Initialization-on-demand holder (preferred — lazy, thread-safe, no sync overhead)
public class AppConfig {
    private AppConfig() {}
    private static class Holder { static final AppConfig INSTANCE = new AppConfig(); }
    public static AppConfig getInstance() { return Holder.INSTANCE; }
}

// Option 3: Enum singleton (simplest, also handles serialization)
public enum AppConfig {
    INSTANCE;
    public void doSomething() { ... }
}` },

{ cat:"Design Patterns", tag:"tag-design", q:"Builder pattern — when and why to use it.",
  ans:`Use when: (1) Object has many parameters, many of which are optional. (2) You want an immutable object. (3) Constructor telescoping becomes unreadable.<br>Avoids: <code>new Pizza(size, crust, null, true, false, null, true)</code> — parameter order is unclear.`,
  code:`// Manual builder (or use Lombok @Builder)
public final class HttpRequest {
    private final String url;
    private final String method;
    private final Map<String,String> headers;
    private final String body;
    private final int timeoutMs;

    private HttpRequest(Builder b) {
        this.url = Objects.requireNonNull(b.url);
        this.method = b.method;
        this.headers = Map.copyOf(b.headers);
        this.body = b.body;
        this.timeoutMs = b.timeoutMs;
    }

    public static Builder builder(String url) { return new Builder(url); }

    public static class Builder {
        private final String url;
        private String method = "GET";
        private Map<String,String> headers = new HashMap<>();
        private String body;
        private int timeoutMs = 5000;

        private Builder(String url) { this.url = url; }
        public Builder method(String m) { this.method = m; return this; }
        public Builder header(String k, String v) { headers.put(k, v); return this; }
        public Builder body(String b) { this.body = b; return this; }
        public Builder timeout(int ms) { this.timeoutMs = ms; return this; }
        public HttpRequest build() { return new HttpRequest(this); }
    }
}

// Usage — self-documenting, immutable
HttpRequest req = HttpRequest.builder("https://api.example.com/users")
    .method("POST")
    .header("Authorization", "Bearer " + token)
    .body(jsonBody)
    .timeout(3000)
    .build();` },

{ cat:"Design Patterns", tag:"tag-design", q:"Factory Method vs Abstract Factory.",
  ans:`<strong>Factory Method</strong>: Define an interface for creating ONE product type. Subclasses decide the concrete implementation. Hides instantiation logic from the caller.<br><strong>Abstract Factory</strong>: Create families of related objects (multiple product types) without specifying concrete classes.`,
  code:`// Factory Method — creates one type of Notification
public interface NotificationSender {
    Notification create(String type);
}

@Component
public class NotificationFactory implements NotificationSender {
    public Notification create(String type) {
        return switch (type) {
            case "EMAIL" -> new EmailNotification();
            case "SMS"   -> new SmsNotification();
            case "PUSH"  -> new PushNotification();
            default -> throw new IllegalArgumentException("Unknown: " + type);
        };
    }
}

// Abstract Factory — creates a FAMILY: Button + CheckBox matching a UI theme
interface UIFactory {
    Button createButton();
    CheckBox createCheckBox();
}
class MaterialUIFactory implements UIFactory { ... }
class FluentUIFactory  implements UIFactory { ... }` },

// Additional Core Java Qs added (1-22)
{ cat:"Core Java", tag:"tag-core", q:"1. What are the main features of Java, and how do they make it different from other programming languages?",
  ans:`Java is object-oriented, platform-independent (bytecode + JVM), strongly typed, has automatic memory management (GC), rich standard library (collections, concurrency, I/O), built-in multithreading primitives, and a mature ecosystem (JVM tooling, frameworks). Compared to languages like C/C++ it manages memory for you and avoids manual pointers; compared to dynamically typed languages it offers compile-time type safety and predictable performance characteristics.` },

{ cat:"Core Java", tag:"tag-core", q:"2. How do you compile and run a Java program from the command line, and what happens during compilation and execution?",
  ans:`Compile with <code>javac MyApp.java</code> which produces bytecode (.class). Run with <code>java MyApp</code> which starts the JVM, loads the class, verifies bytecode, links classes, initializes static state and executes the <code>main</code> method. During execution the JIT may compile hot bytecode to native machine code for performance and the GC manages memory.` },

{ cat:"Core Java", tag:"tag-core", q:"3. Why is Java considered platform-independent, and what role do the JVM and bytecode play?",
  ans:`Java compiles to platform-neutral bytecode which the JVM interprets or JIT-compiles on each OS/architecture. The JVM provides a stable runtime environment and standard libraries, so the same .class files run on any system with a compatible JVM — "write once, run anywhere."` },

{ cat:"Core Java", tag:"tag-core", q:"4. What is the role of public, static, and void in public static void main(String[] args)?",
  ans:`<strong>public</strong>: accessible by the JVM from outside the package. <strong>static</strong>: JVM can call it without an instance. <strong>void</strong>: method returns nothing. The signature <code>public static void main(String[] args)</code> is the program entry point the JVM looks for.` },

{ cat:"Core Java", tag:"tag-core", q:"5. What is the difference between == and equals() in Java?",
  ans:`<code>==</code> compares reference identity for objects (and value for primitives). <code>equals()</code> is a method for logical/content equality and can be overridden (e.g., String, wrapper types, custom classes). Always use <code>equals()</code> when comparing object contents unless you specifically need reference equality.` },

{ cat:"Core Java", tag:"tag-core", q:"6. How does exception handling work in Java, and difference between checked, unchecked exceptions, and errors?",
  ans:`Exceptions are thrown and optionally caught with <code>try/catch/finally</code>. <strong>Checked</strong> exceptions (subclass of Exception, not RuntimeException) must be declared or caught (e.g., IOException). <strong>Unchecked</strong> exceptions (RuntimeException) are programming errors (NPE, IAE) and need not be declared. <strong>Errors</strong> (subclass of Error) are serious JVM issues (OutOfMemoryError) and usually not recoverable.` },

{ cat:"Core Java", tag:"tag-core", q:"7. What happens if we declare a StringBuffer as final, can its value change?",
  ans:`Declaring reference final prevents reassignment of the variable, but does not make the object immutable. A final <code>StringBuffer</code> reference cannot point to another object, but you can still call mutating methods like <code>append()</code> to change its contents.` },

{ cat:"Core Java", tag:"tag-core", q:"8. Which Java versions have you worked on, and what key features did you use?",
  ans:`Common interview answer: list versions you used (e.g., Java 8, 11, 17, 21) and mention features: Java 8 streams/lambdas, Optional, Date/Time API; Java 11 HTTP client; Java 17 sealed classes/records; Java 21 virtual threads (if used). Focus on concrete examples from your projects.` },

{ cat:"Core Java", tag:"tag-core", q:"9. How would you reverse a string without using a temporary variable or inbuilt methods?",
  ans:`Use a two-pointer swap on a char array in place: convert to char[], swap chars at left/right indices while left<right. This uses O(1) extra space and O(n) time.` ,
  code:`char[] s = str.toCharArray(); for (int i=0, j=s.length-1; i<j; i++, j--) { char t=s[i]; s[i]=s[j]; s[j]=t; } return new String(s);` },

{ cat:"Core Java", tag:"tag-core", q:"10. Difference between array and ArrayList (memory, performance, use cases).",
  ans:`Array: fixed-size, contiguous memory, primitives supported, lower overhead and fast indexed access. ArrayList: dynamic-size wrapper over array, stores objects (autoboxing for primitives), supports resizing/insert/remove with amortized cost. Use arrays for fixed-size or primitive-heavy workloads; use ArrayList for dynamic collections and convenience.` },

{ cat:"Core Java", tag:"tag-core", q:"11. Have you used StringBuffer, and when is it appropriate?",
  ans:`StringBuffer is synchronized and safe for multi-threaded mutation but has higher cost. Prefer StringBuilder for single-threaded use. Use StringBuffer only when multiple threads share and mutate the same buffer without external synchronization.` },

{ cat:"Core Java", tag:"tag-core", q:"12. Why avoid String concatenation (+) inside loops vs StringBuilder.append()?",
  ans:`String + in loops can create many temporary String objects (immutable), causing GC pressure. <code>StringBuilder.append()</code> mutates a single buffer with lower allocation overhead and better performance in repeated concatenation scenarios.` },

{ cat:"Core Java", tag:"tag-core", q:"13. Given a sentence, how do you extract all words into an array?",
  ans:`Split using a regex that matches whitespace or punctuation: <code>String[] words = sentence.trim().split("\\W+");</code> (adjust for apostrophes). Optionally filter out empty strings and normalize case.` },

{ cat:"Core Java", tag:"tag-core", q:"14. How to handle multiple exceptions like IOException, FileNotFoundException, and generic Exception?",
  ans:`Use multi-catch or ordered catches. For multi-catch: <code>catch (IOException | SomeOtherException ex)</code>. When subclass relationship exists (FileNotFoundException extends IOException) catch the more specific first, then broader exceptions. Avoid catching generic Exception unless necessary.` },

{ cat:"Core Java", tag:"tag-core", q:"15. If user inputs any type (string, char, object), which data structure to use: array or ArrayList?",
  ans:`Use an <code>ArrayList<Object></code> (or List<Object>) for variable-sized heterogeneous input. It supports dynamic resizing and common collection operations; arrays are less flexible and require casting/size management.` },

{ cat:"Core Java", tag:"tag-core", q:"16. Given an array with strings and special characters, how filter only string values?",
  ans:`If array is Object[], filter by type: <code>Arrays.stream(arr).filter(o -> o instanceof String).map(o -> (String)o).toArray(String[]::new)</code>. For char tokens or punctuation represented as characters, adjust predicate accordingly.` },

{ cat:"Core Java", tag:"tag-core", q:"17. What is a ClassLoader and how does class-loading work (Bootstrap, Extension, Application)?",
  ans:`ClassLoader loads .class bytes into the JVM. Bootstrap loads core JDK classes, Extension (platform) loads optional JARs, Application (system) loads app classes from classpath. JVM uses parent-delegation: request goes to parent first to avoid duplicate definitions; custom loaders can break delegation for advanced use cases (plugins, hot-reload).` },

{ cat:"Core Java", tag:"tag-core", q:"18. How is memory managed: stack, heap, metaspace, program counter?",
  ans:`Stack: per-thread frames (local variables, return addresses) freed on method exit. Heap: shared, stores objects, GC-managed. Metaspace: native memory for class metadata. Program Counter: per-thread pointer to current JVM bytecode instruction. Proper separation helps concurrency and GC behavior.` },

{ cat:"Core Java", tag:"tag-core", q:"19. What is garbage collection, heap generations, GC algorithms, and why are Xms/Xmx important?",
  ans:`GC reclaims unused objects. Heap is split: Young (Eden + Survivors) for short-lived objects and Old for long-lived objects. Algorithms: Serial, Parallel, CMS, G1, ZGC, Shenandoah. <code>-Xms</code> sets initial heap size and <code>-Xmx</code> sets max heap; tuning them affects GC frequency and pause behavior.` },

{ cat:"Core Java", tag:"tag-core", q:"20. How does JVM decide when to perform garbage collection?",
  ans:`GC triggers based on heap pressure: Eden fills (minor GC), promotion thresholds, allocation failures, or explicit System.gc() (discouraged). The GC algorithm and heuristics (survivor percentages, tenuring thresholds) influence when collections happen.` },

{ cat:"Core Java", tag:"tag-core", q:"21. What is immutability, and why is it important?",
  ans:`Immutability means object state cannot change after construction. Benefits: thread-safety without locks, simpler reasoning, safe reuse as map keys, and reduced defensive copying. Use for value objects (Money, UUID wrappers).` },

{ cat:"Core Java", tag:"tag-core", q:"22. How to create a truly immutable class in Java and rules to follow?",
  ans:`Make class final, fields private final, initialize via constructor, avoid setters, defensively copy mutable inputs/outputs, and ensure no methods expose internal mutable state. Example: use <code>List.copyOf()</code> and return unmodifiable views.` },
// Advanced Core Java Qs (23-47)
{ cat:"Core Java", tag:"tag-core", q:"23. What is serialization in Java and best practices/pitfalls?",
  ans:`Serialization converts an object graph to a byte stream (implements Serializable). Best practices: declare <code>serialVersionUID</code>, avoid serializing sensitive data (mark transient), prefer custom readObject/writeObject for control, and use stable DTOs for long-term persistence. Pitfalls: security risks from deserialization, compatibility breaks, and large payloads.` },

{ cat:"Core Java", tag:"tag-core", q:"24. If superclass method throws a runtime exception and subclass adds throws clause, will it compile?",
  ans:`Overriding methods cannot introduce new checked exceptions not declared by the superclass. Unchecked (runtime) exceptions can be thrown freely. Adding a new checked exception to the subclass's throws clause will cause a compile error.` },

{ cat:"Core Java", tag:"tag-core", q:"25. Why might a program throw ClassNotFoundException at runtime even if compiled?",
  ans:`Because the class is missing from the runtime classpath or classloader cannot locate it (missing JAR, module boundary, or custom classloader isolation).` },

{ cat:"Core Java", tag:"tag-core", q:"26. What is a marker interface? Examples and usage.",
  ans:`A marker interface carries metadata via type only (no methods). Examples: <code>Serializable</code>, <code>Cloneable</code>, <code>Remote</code>. Annotations are preferred today for richer metadata.` },

{ cat:"Core Java", tag:"tag-core", q:"27. Why avoid StringBuffer in modern Java apps?",
  ans:`StringBuffer is synchronized which incurs overhead; prefer <code>StringBuilder</code> for single-threaded use and mutable concatenation. Use StringBuffer only when multiple threads share the same buffer without external synchronization.` },

{ cat:"Core Java", tag:"tag-core", q:"28. Will using String objects for millions of records create memory or performance issues?",
  ans:`Yes. Large numbers of String instances increase heap usage and GC work. Use streaming, interning cautiously, char[] reuse, or compact representations and consider off-heap or chunked processing for very large datasets.` },

{ cat:"Core Java", tag:"tag-core", q:"29. Java 8 features: list main ones and an example.",
  ans:`Lambdas, Streams API, Optional, default/static methods in interfaces, and java.time (Date/Time API). They enable concise functional-style code and safer null handling.`,
  code:`List<String> names = List.of("Alice","Bob","Anna");
List<String> aNames = names.stream()
    .filter(s -> s.startsWith("A"))
    .map(String::toUpperCase)
    .collect(Collectors.toList());` },

{ cat:"Core Java", tag:"tag-core", q:"30. Why are equals() and hashCode() critical in real systems?",
  ans:`Collections like HashMap use hashCode for bucket placement and equals for equality checks. Inconsistent implementations break collection invariants leading to missing or duplicate entries and subtle bugs.` },

{ cat:"Core Java", tag:"tag-core", q:"31. Can a top-level class be declared private and still have a main() executed?",
  ans:`No — top-level classes cannot be private in Java; attempting to declare one private results in a compile-time error.` },

{ cat:"Core Java", tag:"tag-core", q:"32. How do you create a custom annotation?",
  ans:`Use <code>@interface</code> and specify retention and target. Example: <code>@Retention(RetentionPolicy.RUNTIME) @Target(ElementType.METHOD) public @interface Timed {}</code>. Process with reflection or annotation processors.` },

{ cat:"Core Java", tag:"tag-core", q:"33. Is it possible to declare a constructor final? Why or why not?",
  ans:`No. Constructors are not inherited and cannot be overridden, so the <code>final</code> modifier doesn't apply and is disallowed by the language.` },

{ cat:"Core Java", tag:"tag-core", q:"34. What is a final class and when to use it?",
  ans:`A final class cannot be subclassed. Use it for immutable types, API stability, or security-sensitive classes where extension might break invariants.` },

{ cat:"Core Java", tag:"tag-core", q:"35. What is covariant method overriding?",
  ans:`An overriding method that narrows the return type to a subtype of the original method's return. Java supports covariant return types, improving type safety.` },

{ cat:"Core Java", tag:"tag-core", q:"36. Are you familiar with Java 21 features, and which ones have you used?",
  ans:`Java 21 brings Project Loom features (virtual threads), pattern matching improvements and collection enhancements. Mention any used features like virtual threads for high-concurrency tasks or record patterns.` },

{ cat:"Core Java", tag:"tag-core", q:"37. Explain the internal working of HashMap.",
  ans:`HashMap uses an internal array of bins (Node<K,V>). Keys are hashed and mapped to an index. Collisions are stored in linked lists or trees (after threshold). When load factor threshold exceeded, the table resizes and entries are rehashed.` },

{ cat:"Core Java", tag:"tag-core", q:"38. How does HashMap handle collisions? (LinkedList vs Tree structure in Java 8+)",
  ans:`Initially collisions are handled by chaining with linked lists. If a bucket becomes large (exceeds TREEIFY_THRESHOLD) and table is sufficiently big, the list is converted to a balanced Red-Black tree for O(log n) lookups.` },

{ cat:"Core Java", tag:"tag-core", q:"39. Why is the default load factor of HashMap set to 0.75?",
  ans:`0.75 offers a practical balance between space efficiency and time: it keeps memory usage reasonable while keeping collision probability low to maintain good average lookup performance.` },

{ cat:"Core Java", tag:"tag-core", q:"40. What is the Java Memory Model?",
  ans:`The JMM specifies rules for visibility, ordering, and atomicity across threads (happens-before). It defines how operations on memory by one thread become visible to others and how volatile and synchronized affect ordering.` },

{ cat:"Core Java", tag:"tag-core", q:"41. Explain thread safety and concurrency concepts in Java.",
  ans:`Thread-safety ensures correct behavior under concurrent access. Techniques: immutability, synchronization, explicit locks, volatile for visibility, atomic classes and concurrent collections. Favor high-level concurrency utilities over low-level primitives.` },

{ cat:"Core Java", tag:"tag-core", q:"42. How do JVM arguments impact performance, and common tuning parameters?",
  ans:`JVM args set heap sizes, choose GC algorithm, and control runtime behavior. Common flags: <code>-Xms</code>, <code>-Xmx</code>, <code>-XX:+UseG1GC</code>, <code>-XX:MaxGCPauseMillis</code>, <code>-Xss</code> (stack size), and GC logging flags for diagnostics.` },

{ cat:"Core Java", tag:"tag-core", q:"43. How do you identify a memory leak in a running Java application?",
  ans:`Capture heap dumps and analyze with tools like Eclipse MAT or VisualVM; look for growing retained sizes, GC roots keeping objects alive, suspicious static collections, and unclosed resources. Add allocation telemetry and enable leak detection thresholds.` },

{ cat:"Core Java", tag:"tag-core", q:"44. When would you choose CompletableFuture over ExecutorService?",
  ans:`Choose CompletableFuture when you need non-blocking, composable async pipelines and flexible error handling. Use ExecutorService when you need explicit control over thread lifecycle and scheduling.` },

{ cat:"Core Java", tag:"tag-core", q:"45. When should you avoid using synchronized and prefer Lock?",
  ans:`Prefer Lock when you need tryLock with timeout, interruptible lock acquisition, multiple condition variables, or explicit fairness policies—features not available with synchronized.` },

{ cat:"Core Java", tag:"tag-core", q:"46. Why are Strings immutable in Java? Explain security and performance reasons.",
  ans:`Immutability enables safe sharing across threads, supports interning and cached hashCode, and prevents accidental or malicious changes to values like class names or file paths after validation—important for security and consistent behavior.` },

{ cat:"Core Java", tag:"tag-core", q:"47. What does a Java Stream actually do internally, and how does it differ from loops?",
  ans:`Streams build a pipeline of lazy intermediate operations backed by a Spliterator and functional operators; terminal operations drive traversal and may fuse stages. Unlike loops (external iteration), streams offer internal iteration, declarative style, and easy parallelization via fork/join under the hood.` },
// OOP Questions (48-62)
{ cat:"OOP", tag:"tag-design", q:"48. What are the four OOP principles, and examples?",
  ans:`Encapsulation: hide internal state via private fields and expose behavior via methods (e.g., Account.getBalance()). Inheritance: derive specialized classes from a base class (e.g., Employee -> Manager). Polymorphism: use a base type reference to hold subtype instances and call overridden methods. Abstraction: expose high-level interfaces while hiding implementation details.` },

{ cat:"OOP", tag:"tag-design", q:"49. What are abstract classes and when to use them?",
  ans:`Abstract classes allow shared implementation and abstract methods for subclasses to implement. Use when subclasses share code and a common base state, but you still want to enforce certain method implementations.` },

{ cat:"OOP", tag:"tag-design", q:"50. Difference between abstract class and interface; when to choose which?",
  ans:`Interfaces define contracts (multiple inheritance allowed) with default/static methods; abstract classes can hold state and constructors. Prefer interfaces for capabilities and multiple inheritance; use abstract class for shared code/state among related classes.` },

{ cat:"OOP", tag:"tag-design", q:"51. How to compare custom objects: Comparable vs Comparator?",
  ans:`Implement Comparable<T> in the class to define natural ordering via compareTo(). Use Comparator<T> to provide external ordering strategies (lambda-friendly) or multiple orderings without changing the class.` },

{ cat:"OOP", tag:"tag-design", q:"52. Can an interface implement a class? Why not?",
  ans:`No. Interfaces declare behavior; they cannot implement classes. Java forbids interfaces from extending concrete class implementations because interfaces express a contract, not concrete inheritance.` },

{ cat:"OOP", tag:"tag-design", q:"53. What is the diamond problem and how does Java solve it?",
  ans:`Diamond problem arises with multiple inheritance of implementation leading to ambiguity. Java avoids it by disallowing multiple class inheritance; interfaces may have default methods but conflicts are resolved by explicit override or choosing super implementations.` },

{ cat:"OOP", tag:"tag-design", q:"54. Why must equal objects have same hash code?",
  ans:`Collections like HashMap rely on hashCode to bucket objects. If equal objects have different hash codes they may end up in different buckets causing lookups to fail. The contract preserves collection correctness.` },

{ cat:"OOP", tag:"tag-design", q:"55. Why override hashCode() when overriding equals()?",
  ans:`To maintain the equals/hashCode contract: equal objects must produce same hashCode. Failing to override both leads to incorrect behavior in hashed collections (lost or duplicated entries).` },

{ cat:"OOP", tag:"tag-design", q:"56. Student(id,name) — can two students with same name be equal? How design equals/hashCode?",
  ans:`Define equality based on business identity: if ID uniquely identifies a student, use id in equals/hashCode. If business rule says name determines equality, use name. Implement both methods consistently and include only immutable or stable fields.` },

{ cat:"OOP", tag:"tag-design", q:"57. What are default methods in interfaces and why introduced?",
  ans:`Default methods allow adding new behavior to interfaces without breaking existing implementors. Introduced in Java 8 to evolve APIs (e.g., Stream additions) while preserving backward compatibility.` },

{ cat:"OOP", tag:"tag-design", q:"58. Mumbai branch needs special behavior; how design using interfaces or default methods?",
  ans:`Provide a common interface with default behavior and override the Mumbai branch implementation with a class that implements the interface and overrides the default method to supply special behavior. This avoids impacting other branches.` },

{ cat:"OOP", tag:"tag-design", q:"59. Add new functionality for all branches without breaking existing code?",
  ans:`Add a default method in the interface (Java 8+) providing a backward-compatible default implementation, or extend the interface and update implementations incrementally.` },

{ cat:"OOP", tag:"tag-design", q:"60. Is method overriding resolved at compile time or runtime? Explain dynamic dispatch.",
  ans:`Method overriding is resolved at runtime (dynamic dispatch). The JVM selects the concrete implementation based on the actual object's class (not reference type) using virtual method tables (vtable) or equivalent lookup.` },

{ cat:"OOP", tag:"tag-design", q:"61. What are equals() and hashCode(), how used internally by collections?",
  ans:`equals() compares logical equality; hashCode gives an int used to choose hash bucket. Hash-based collections compute hashCode for bucket selection and use equals to find matching keys within the bucket.` },

{ cat:"OOP", tag:"tag-design", q:"62. Why were default methods introduced in Java 8 and what problem do they solve?",
  ans:`Default methods enable interface evolution by providing a default implementation so adding a method won't break existing implementors. They solve the API evolution problem (e.g., adding Stream methods to Collection).` },

// Concurrency & Async (63-80)
{ cat:"Concurrency", tag:"tag-conc", q:"63. What is the difference between HashMap and ConcurrentHashMap?",
  ans:`HashMap is not thread-safe for concurrent access and can lead to data corruption if modified by multiple threads. ConcurrentHashMap provides thread-safe concurrent access using finer-grained locking/CAS; reads are mostly lock-free and writes lock only segments/buckets or use CAS, enabling high concurrency without global locking.` },

{ cat:"Concurrency", tag:"tag-conc", q:"64. Which data structure is used internally by HashMap?",
  ans:`HashMap uses an array of bins (Node<K,V>). Each bin is a linked list (or a tree when large). The index is computed by mixing the key's hash and applying (n-1) & hash.` },

{ cat:"Concurrency", tag:"tag-conc", q:"65. What is a ThreadPool and why prefer it over manually creating threads?",
  ans:`ThreadPool (ExecutorService) manages a pool of reusable threads, limiting thread creation overhead and resource usage. It provides queuing, lifecycle management, and rejection policies — use it to control concurrency, throughput and avoid creating too many threads which can exhaust resources.` },

{ cat:"Concurrency", tag:"tag-conc", q:"66. Difference between extending Thread and implementing Runnable?",
  ans:`Extending Thread couples your task to a thread class and prevents subclassing other classes. Implementing Runnable separates task from execution, allows reuse with different executors and is preferred for cleaner design.` },

{ cat:"Concurrency", tag:"tag-conc", q:"67. How does Java manage threads and memory; which data is shared vs thread-local?",
  ans:`Each thread has its own stack (local variables, frames) and program counter. Heap is shared among threads (objects). Thread-local data can be stored in ThreadLocal for per-thread state. Synchronization ensures visibility and ordering between threads.` },

{ cat:"Concurrency", tag:"tag-conc", q:"68. What is a Lock in Java and how is it different from synchronized?",
  ans:`Lock (e.g., ReentrantLock) offers explicit lock/unlock API, tryLock, timed waits, and multiple Condition objects. <code>synchronized</code> is simpler and JVM-managed (enter/exit) but lacks these advanced features.` },

{ cat:"Concurrency", tag:"tag-conc", q:"69. What is the volatile keyword and what guarantees does it provide?",
  ans:`volatile ensures visibility: writes to a volatile variable are immediately visible to other threads and establish a happens-before relationship. It does NOT provide atomicity for compound actions (like ++).` },

{ cat:"Concurrency", tag:"tag-conc", q:"70. Can volatile alone ensure thread safety? Why or why not?",
  ans:`No. Volatile guarantees visibility and ordering for single variable reads/writes but does not provide atomicity for read-modify-write operations. Use atomic classes or synchronization for compound updates.` },

{ cat:"Concurrency", tag:"tag-conc", q:"71. What is ConcurrentHashMap and how does it achieve thread safety internally?",
  ans:`ConcurrentHashMap uses CAS for reads and fine-grained locking/CAS for updates; in Java 8 it uses a combination of volatile/atomic operations and synchronized blocks on bins plus treeification for large buckets, enabling concurrent reads and updates with minimal contention.` },

{ cat:"Concurrency", tag:"tag-conc", q:"72. How does internal working of HashMap and ConcurrentHashMap differ?",
  ans:`HashMap uses simple buckets with potential global rehashing and is not thread-safe. ConcurrentHashMap uses concurrency-friendly algorithms: lock-free reads, per-bucket synchronization or CAS-based updates, and avoids resizing stalls by using forwarders during rehash.` },

{ cat:"Concurrency", tag:"tag-conc", q:"73. How would you create a deadlock using two threads?",
  ans:`Classic example: Thread A locks lock1 then tries to lock lock2; Thread B locks lock2 then tries to lock lock1 — circular wait causes deadlock.` ,
  code:`Object a = new Object(), b = new Object();
Thread t1 = new Thread(() -> { synchronized(a) { sleep(50); synchronized(b) { } } });
Thread t2 = new Thread(() -> { synchronized(b) { sleep(50); synchronized(a) { } } });
t1.start(); t2.start();` },

{ cat:"Concurrency", tag:"tag-conc", q:"74. How can you enable and use asynchronous methods in Spring Boot?",
  ans:`Enable with <code>@EnableAsync</code> and annotate methods with <code>@Async</code>. Provide a TaskExecutor bean (ThreadPoolTaskExecutor) to control thread pool size, queue, and rejected execution policy. Remember: @Async methods must be called from another bean (proxy applies).` },

{ cat:"Concurrency", tag:"tag-conc", q:"75. What are CompletableFutures and how do they help?",
  ans:`CompletableFuture represents an async computation with rich composition APIs (thenApply, thenCompose, exceptionally). They enable non-blocking pipelines, combining multiple async results, timeouts, and fallback strategies without blocking threads.` ,
  code:`CompletableFuture.supplyAsync(() -> fetch())
    .thenApply(this::transform)
    .exceptionally(ex -> fallback());` },

{ cat:"Concurrency", tag:"tag-conc", q:"76. When multiple threads share resources, how does wait() differ from run()?",
  ans:`<code>wait()</code> (Object.wait) causes the current thread to release the monitor and wait to be notified; it's used for coordination. <code>run()</code> simply executes the thread's task and does not release locks or coordinate—it's the thread's entry method.` },

{ cat:"Concurrency", tag:"tag-conc", q:"77. How do you safely unlock a lock to avoid deadlocks or thread starvation?",
  ans:`Always use try/finally: <code>lock.lock(); try { ... } finally { lock.unlock(); }</code>. Prefer timeouts (tryLock with timeout) and avoid holding locks during blocking I/O; keep critical sections small.` ,
  code:`if (lock.tryLock(1, TimeUnit.SECONDS)) {
  try { /* work */ } finally { lock.unlock(); }
} else { /* handle failure */ }` },

{ cat:"Concurrency", tag:"tag-conc", q:"78. If two maps are accessed concurrently, should we use separate synchronized blocks? Why?",
  ans:`Yes — synchronize on different locks (or use concurrent collections) to avoid unnecessary contention and enable parallelism. Coarse-grained locking reduces concurrency and increases contention; fine-grained locking improves throughput but is more complex.` },

{ cat:"Concurrency", tag:"tag-conc", q:"79. How would you monitor and manage async tasks in Spring Boot (progress & failures)?",
  ans:`Use a custom TaskExecutor that records task metadata, expose metrics via Micrometer, track progress via CompletableFuture state or a database/Redis job store, and centralize failure handling with callbacks (.handle/.whenComplete) and Alerting for repeated failures.` },

{ cat:"Concurrency", tag:"tag-conc", q:"80. How have you implemented multithreading in projects and what benefits were observed?",
  ans:`Example answer: used ThreadPoolExecutor and CompletableFutures to parallelize external API calls and batch processing; reduced latency from 4s to 800ms by parallelizing IO-bound tasks and improved throughput. Emphasize profiling, proper pool sizing, and measuring before/after.` },
// Design Patterns (81-91)
{ cat:"Design Patterns", tag:"tag-design", q:"81. What are commonly used design patterns in Java and where are they applied?",
  ans:`Common patterns: Singleton (single instance managers), Factory/AbstractFactory (object creation), Builder (complex immutable objects), Strategy (replaceable algorithms), Decorator (add responsibilities), Observer (event systems), Adapter (integration), Proxy (access control). Use patterns where they improve clarity, reuse, or decouple components.` },

{ cat:"Design Patterns", tag:"tag-design", q:"82. What is the Singleton pattern; implementations and preferred one?",
  ans:`Singleton ensures a single instance. Implementations: enum singleton (recommended), holder idiom (lazy and thread-safe), double-checked locking. Enum is preferred for simplicity, serialization-safety, and reflection resistance.` ,
  code:`// Enum singleton
public enum Config { INSTANCE; public String get(String k) { ... } }` },

{ cat:"Design Patterns", tag:"tag-design", q:"83. Why is the constructor private in a Singleton and how is the instance created?",
  ans:`Private constructor prevents external instantiation; instance is created internally (static field or holder class or enum constant) and exposed via a static accessor.` },

{ cat:"Design Patterns", tag:"tag-design", q:"84. What is the Decorator pattern and when to use it?",
  ans:`Decorator adds behavior to objects at runtime by wrapping them with decorator classes implementing the same interface. Use for flexible, composable behavior additions (e.g., I/O streams: BufferedInputStream adds buffering).` },

{ cat:"Design Patterns", tag:"tag-design", q:"85. Which microservices design patterns have you worked with?",
  ans:`Common ones: Circuit Breaker, Retry, Bulkhead, API Gateway, Saga (choreography/orchestration), CQRS, Event Sourcing. Mention ones used with concrete examples (e.g., Resilience4j circuit breaker).` },
