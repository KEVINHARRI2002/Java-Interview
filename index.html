{ cat:"Design Patterns", tag:"tag-design", q:"86. In Factory pattern, how decide which subclass should create the object?",
  ans:`Use input parameters or configuration (type, strategy) to determine subclass. Encapsulate creation logic in the factory; prefer dependency injection or registration for extensibility.` },

{ cat:"Design Patterns", tag:"tag-design", q:"87. How can Singleton be broken (reflection/serialization) and how to fix?",
  ans:`Reflection can call private constructor; serialization can create new instances. Fixes: use enum singleton (immune to deserialization/reflective creation) or defend with readResolve and checks in constructor to prevent multiple instances.` },

{ cat:"Design Patterns", tag:"tag-design", q:"88. What are SOLID principles and examples in banking domain?",
  ans:`S: Single Responsibility (AccountService handles account ops only). O: Open/Closed (extend fee calculation without modifying existing code). L: Liskov (subtypes must be substitutable, e.g., SavingsAccount behaves like Account). I: Interface Segregation (separate PaymentProcessor and Reporting interfaces). D: Dependency Inversion (depend on abstractions for DB/repo).` },

{ cat:"Design Patterns", tag:"tag-design", q:"89. What is the Circuit Breaker pattern and why important in microservices?",
  ans:`Circuit Breaker prevents cascading failures by opening when downstream errors exceed threshold, returning fast failures or fallback. It protects system resilience and allows failing services to recover without bringing callers down.` },

{ cat:"Design Patterns", tag:"tag-design", q:"90. What is Half-Open state in Circuit Breaker?",
  ans:`Half-Open is a probe state after open timeout where a limited number of calls are allowed to test if the downstream service has recovered; success closes the circuit, failure re-opens it.` },

{ cat:"Design Patterns", tag:"tag-design", q:"91. What is the Saga pattern and difference between Choreography and Orchestration?",
  ans:`Saga manages distributed transactions via sequences of local transactions with compensations on failure. Choreography: services emit/listen to events (decentralized). Orchestration: a central coordinator calls services (easier to track/debug).` },

// Spring Core & Boot (92-119)
{ cat:"Spring Boot", tag:"tag-spring", q:"92. How does Spring Boot simplify deployment compared to traditional Spring applications?",
  ans:`Spring Boot provides opinionated starters, auto-configuration, and an embedded servlet container (Tomcat/Jetty) so apps can be packaged as executable JARs and run with java -jar. This reduces boilerplate configuration and eases deployment.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"93. What is Inversion of Control (IoC) and how does Dependency Injection work in Spring?",
  ans:`IoC inverts control of object creation to a container. Spring's DI injects dependencies via constructor, setter, or field injection, wiring beans by type, name or qualifiers configured in the ApplicationContext.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"94. How are beans created and managed in the Spring container?",
  ans:`Beans are instantiated by the container using component scanning, @Bean factory methods, or explicit registration. The container manages lifecycle events, dependency injection, scopes, and destruction callbacks.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"95. What is the default bean scope in Spring?",
  ans:`Singleton: a single shared instance per ApplicationContext. Other scopes: prototype, request, session, application, and custom scopes.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"96. Which annotations are used to create beans in Spring?",
  ans:`@Component, @Service, @Repository, @Controller/@RestController for components; @Configuration with @Bean methods for programmatic beans. Use @ComponentScan or auto-configuration to discover them.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"97. What is the difference between @Primary and @Qualifier?",
  ans:`@Primary marks a bean as the default when multiple candidates exist. @Qualifier disambiguates by name or custom qualifier annotation to select a specific bean.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"98. What is @Profile and when should it be used?",
  ans:`@Profile marks beans or configurations active for specific environments (dev, test, prod). Use to separate environment-specific beans like datasource settings or feature toggles.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"99. What is the lifecycle of a bean?",
  ans:`Instantiate → Populate properties → setBeanName/setBeanFactory → postProcessBeforeInitialization → @PostConstruct / init-method → postProcessAfterInitialization → bean in use → @PreDestroy / destroy-method on context close.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"100. How do you handle exception handling in REST controllers in Spring Boot?",
  ans:`Use @ControllerAdvice/@RestControllerAdvice with @ExceptionHandler methods to return consistent error responses and HTTP status codes. For validation errors use @Valid and handle MethodArgumentNotValidException.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"101. What is the internal lifecycle of a Spring bean?",
  ans:`Container creates bean instance, performs dependency injection, applies BeanPostProcessors, calls lifecycle callbacks (InitializingBean, @PostConstruct), and when context is closed it triggers destruction callbacks (DisposableBean, @PreDestroy, destroy-method).` },

{ cat:"Spring Boot", tag:"tag-spring", q:"102. How do you handle circular dependencies in Spring?",
  ans:`Prefer constructor injection; circular constructor deps cause failure. Use setter injection, @Lazy, ObjectProvider, or break cycles by refactoring. For prototype beans or complex cycles, redesign to remove the circular dependency.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"103. How can you prevent auto-configuration when a custom bean already exists?",
  ans:`Spring Boot auto-configurations commonly use @ConditionalOnMissingBean so your custom @Bean will override auto-configured ones. You can also disable specific auto-config classes via spring.autoconfigure.exclude.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"104. What are correlation IDs and why are they used?",
  ans:`Correlation IDs are unique identifiers propagated across request chains to trace and correlate logs, metrics, and distributed calls for debugging and observability.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"105. How do you fetch the correlation ID in a Spring Boot application?",
  ans:`Store the correlation ID in MDC (Mapped Diagnostic Context) within a servlet Filter or WebMvc interceptor; then fetch via MDC.get("correlationId") in services or logging layouts.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"106. How do you set an existing correlation ID in Spring Boot?",
  ans:`Read the incoming header (e.g., X-Correlation-Id) in a Filter and call MDC.put("correlationId", headerValue) so it's available to downstream code and loggers.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"107. How do you create a new correlation ID?",
  ans:`Generate a UUID when none is provided, set it into MDC and add the header to outgoing requests so downstream services receive the same correlation ID.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"108. Can a Spring Boot project connect to two different databases at the same time?",
  ans:`Yes. Configure multiple DataSource beans, mark one @Primary, and provide separate EntityManagerFactory and PlatformTransactionManager for each persistence unit (JPA) or use routing datasources for multi-tenancy.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"109. How do you connect to multiple databases in Spring Boot?",
  ans:`Define two DataSource beans (properties namespaces), configure two LocalContainerEntityManagerFactoryBean beans and two JpaTransactionManager beans, and use @Transactional("txManagerName") to bind transactions to the correct DB.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"110. What is difference between @Component, @Service, and @Repository?",
  ans:`Semantically they annotate stereotypes: @Component is generic, @Service indicates service-layer, @Repository indicates data/repo layer and enables exception translation into Spring DataAccessException. Functionally they are similar for component scanning.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"111. Explain bean scopes and the Spring bean lifecycle.",
  ans:`Scopes: singleton (one per context), prototype (new instance per request), request/session (web scopes), application, websocket, and custom scopes. Lifecycle covered in question 99/101: init callbacks, post-processors, and destroy callbacks.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"112. Describe the Spring Boot application startup sequence.",
  ans:`SpringApplication.run() creates an ApplicationContext, loads environment and properties, runs auto-configuration classes, registers beans, initializes them (post-processors, @PostConstruct), and starts embedded server (if web).` },

{ cat:"Spring Boot", tag:"tag-spring", q:"113. How does @Transactional work internally and common pitfalls?",
  ans:`@Transactional is implemented via proxies (AOP). Proxy intercepts method call to start/commit/rollback transactions using PlatformTransactionManager. Pitfalls: self-invocation bypasses proxy, using private methods, incorrect propagation types, and mixing transactional boundaries across threads.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"114. Design a rate limiter allowing 5 requests per user per minute.",
  ans:`Use a distributed counter per user in Redis with TTL of 1 minute, increment atomically (INCR) and check value <=5; or use a token bucket algorithm stored in Redis or use a library (Bucket4j, Resilience4j).` },

{ cat:"Spring Boot", tag:"tag-spring", q:"115. How to handle file upload in Spring Boot and persist it?",
  ans:`Controller accepts MultipartFile; service validates and either streams to disk/DB/S3. For DB persistence, store as BLOB (beware size) or better upload to object store (S3) and save reference in DB.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"116. What is Spring WebFlux and how does it work?",
  ans:`WebFlux is reactive, non-blocking web framework using Reactor (Mono/Flux). Works on non-blocking runtimes (Netty) and scales with fewer threads for I/O-bound workloads. Use reactive repositories and backpressure-aware streams.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"117. How to configure an Amazon S3 client in Spring Boot?",
  ans:`Use AWS SDK v2 or Spring Cloud AWS, configure credentials via environment, profile, or IAM roles, and inject S3Client bean configured with region. Keep secrets out of code, use IAM roles in production.` },

{ cat:"Spring Boot", tag:"tag-spring", q:"118. How to configure Redis client and ensure cache updated only after DB commit?",
  ans:`Use Lettuce or Jedis as client, configure CacheManager. To update cache after DB commit, use TransactionSynchronizationManager.registerSynchronization to update/remove cache on afterCommit or publish an event handled after transaction commit (ApplicationEvent + @TransactionalEventListener(phase = AFTER_COMMIT)).` },

{ cat:"Spring Boot", tag:"tag-spring", q:"119. How to configure and manage two different databases in single Spring Boot app (routing & transactions)?",
  ans:`Define multiple DataSources, two EntityManagerFactory beans, and two transaction managers. For routing, implement AbstractRoutingDataSource to choose DataSource at runtime, and ensure transaction managers are used explicitly for operations targeting each DB.` },

// Web & Security (120-143)
{ cat:"REST & Security", tag:"tag-rest", q:"120. What is CORS and how do you enable it in Spring Boot?",
  ans:`CORS is Cross-Origin Resource Sharing; it controls which domains can access resources. In Spring Boot enable it with @CrossOrigin on controllers or configure a CorsConfigurationSource bean for global settings.` },

{ cat:"REST & Security", tag:"tag-rest", q:"121. How does Spring Security authenticate users?",
  ans:`Spring Security authenticates by building an Authentication object from credentials and passing it to AuthenticationManager, which delegates to configured AuthenticationProvider(s) like DaoAuthenticationProvider or OAuth2 providers.` },

{ cat:"REST & Security", tag:"tag-rest", q:"122. What is the difference between authentication and authorization?",
  ans:`Authentication proves identity (who the user is). Authorization determines permissions (what the user can do). Both are enforced by security layers.` },

{ cat:"REST & Security", tag:"tag-rest", q:"123. How do you secure a REST endpoint in Spring Boot?",
  ans:`Use Spring Security configuration with HttpSecurity to require authentication/roles for endpoint patterns, or annotate controllers with @PreAuthorize or @RolesAllowed for method-level access control.` },

{ cat:"REST & Security", tag:"tag-rest", q:"124. What is JWT and why use it?",
  ans:`JWT (JSON Web Token) is a compact, self-contained token with signed claims. Use it for stateless authentication in APIs because it carries identity and expiry without server session state.` },

{ cat:"REST & Security", tag:"tag-rest", q:"125. How do you validate a JWT in a Spring Boot app?",
  ans:`Parse the token using a JWT library, verify the signature and expiry, extract claims, and create an Authentication object to populate SecurityContext if valid.` },

{ cat:"REST & Security", tag:"tag-rest", q:"126. What is CSRF and how does Spring Security protect against it?",
  ans:`CSRF is a cross-site request forgery attack that exploits authenticated browser sessions. Spring Security protects with a token (CsrfToken) that must be submitted in state-changing requests, preventing unauthorized cross-origin actions.` },

{ cat:"REST & Security", tag:"tag-rest", q:"127. When should CSRF protection be disabled?",
  ans:`Disable CSRF for stateless APIs that do not use browser sessions, especially when using token-based auth like JWT and only accepting JSON requests from trusted clients.` },

{ cat:"REST & Security", tag:"tag-rest", q:"128. How do you implement Basic Auth in Spring Boot?",
  ans:`Configure HttpSecurity to httpBasic() and define a UserDetailsService or in-memory users. It sends credentials in Authorization headers and should always be used over HTTPS.` },

{ cat:"REST & Security", tag:"tag-rest", q:"129. How do you implement OAuth2 login in Spring Boot?",
  ans:`Use spring-boot-starter-oauth2-client, configure client registration in application.properties, and let Spring Security handle redirects, token exchanges, and user info retrieval for providers like Google or GitHub.` },

{ cat:"REST & Security", tag:"tag-rest", q:"130. What are filters and interceptors in Spring?",
  ans:`Filters are servlet-level components that process requests before the Spring MVC pipeline. Interceptors are Spring MVC components that run before/after controller handlers and can modify requests, responses, or model data.` },

{ cat:"REST & Security", tag:"tag-rest", q:"131. What is OAuth2 Resource Server?",
  ans:`OAuth2 Resource Server validates access tokens on incoming requests and enforces scopes/authorities. Spring Security can be configured with JWT or opaque token introspection to protect API resources.` },

{ cat:"REST & Security", tag:"tag-rest", q:"132. How do you implement role-based access control in Spring Security?",
  ans:`Assign GrantedAuthority values to authenticated principal, configure antMatchers or method-level @PreAuthorize/@Secured expressions using roles, and ensure role prefixing matches the security configuration.` },

{ cat:"REST & Security", tag:"tag-rest", q:"133. What is the purpose of SecurityContextHolder?",
  ans:`SecurityContextHolder stores the currently authenticated user's SecurityContext for the active thread, allowing secure access to authentication and authority details anywhere in the code.` },

{ cat:"REST & Security", tag:"tag-rest", q:"134. How do you secure endpoints with HTTPS in Spring Boot?",
  ans:`Configure server.ssl properties with keystore and certificate details, or terminate TLS at a load balancer/reverse proxy. Always use HTTPS for any authentication or sensitive data exchange.` },

{ cat:"REST & Security", tag:"tag-rest", q:"135. How do you handle authentication failures in Spring Security?",
  ans:`Customize AuthenticationFailureHandler or exception handling in SecurityFilterChain; return a structured error response, log the failure reason, and avoid leaking sensitive details.` },

{ cat:"REST & Security", tag:"tag-rest", q:"136. How do you configure session management in Spring Security?",
  ans:`Use sessionManagement() in HttpSecurity to enforce stateless sessions, maximum sessions, session fixation protection, or custom session creation policies.` },

{ cat:"REST & Security", tag:"tag-rest", q:"137. How do you secure file uploads?",
  ans:`Validate file type and size, store uploads outside web root, scan for malware, and enforce authentication/authorization before handling the file payload.` },

{ cat:"REST & Security", tag:"tag-rest", q:"138. How do you perform input validation in Spring Boot?",
  ans:`Use @Valid/@Validated with Bean Validation annotations like @NotNull, @Size, @Pattern, and handle BindingResult or MethodArgumentNotValidException for structured validation responses.` },

{ cat:"REST & Security", tag:"tag-rest", q:"139. What is rate limiting and how do you implement it in APIs?",
  ans:`Rate limiting caps client request volume to protect services. Implement with API gateway rules, custom servlet filters, or Redis-backed counters/token buckets to reject or delay excess requests.` },

{ cat:"REST & Security", tag:"tag-rest", q:"140. How do you prevent SQL injection in Spring applications?",
  ans:`Use prepared statements, Spring Data/JPA parameter binding, and avoid concatenating user input into SQL strings. Also validate and sanitize inputs when appropriate.` },

{ cat:"REST & Security", tag:"tag-rest", q:"141. What is secure coding for REST APIs?",
  ans:`Use authentication/authorization, validate inputs, sanitize outputs, use HTTPS, handle errors safely, and avoid exposing sensitive data. Follow least privilege and secure defaults.` },

{ cat:"REST & Security", tag:"tag-rest", q:"142. How do you design a safe public API contract?",
  ans:`Define stable versioned endpoints, document required inputs/outputs, provide clear error codes, limit data exposure, and design for idempotency and backward compatibility.` },

{ cat:"REST & Security", tag:"tag-rest", q:"143. How do you implement audit logging for sensitive operations?",
  ans:`Log who did what, when, and where without recording secrets. Use structured logs or an audit store, correlate with user/session identifiers, and ensure logs are tamper-resistant.` },

// CI/CD & DevOps (144-148)
{ cat:"System Design", tag:"tag-devops", q:"144. What is CI/CD and why is it important?",
  ans:`CI/CD automates building, testing, and deploying code changes. It reduces manual errors, shortens feedback loops, and enables more frequent, reliable software delivery.` },

{ cat:"System Design", tag:"tag-devops", q:"145. What is the difference between Continuous Integration and Continuous Deployment?",
  ans:`Continuous Integration means merging code changes frequently and running automated tests. Continuous Deployment means automatically deploying every successful change to production, while Continuous Delivery means changes are production-ready and can be deployed on demand.` },

{ cat:"System Design", tag:"tag-devops", q:"146. What tools have you used for CI/CD pipelines?",
  ans:`Common tools: Jenkins, GitHub Actions, GitLab CI, CircleCI, Azure DevOps, and Travis CI. Mention build tools like Maven/Gradle and artifact registries such as Nexus or Artifactory.` },

{ cat:"System Design", tag:"tag-devops", q:"147. How do you ensure rollback capability in deployments?",
  ans:`Keep versioned artifacts, use deployment strategies like blue/green or canary, and automate rollback procedures. Validate health checks so failures trigger rollbacks or route traffic away from bad instances.` },

{ cat:"System Design", tag:"tag-devops", q:"148. How do you monitor application health after deployment?",
  ans:`Use metrics, logs, traces, and alerts. Monitor response times, error rates, resource usage, and business metrics, and connect them to alerting/incident response so issues are detected quickly.` },

// Microservices (149-159)
{ cat:"System Design", tag:"tag-micro", q:"149. What defines a microservice architecture?",
  ans:`Microservices are independently deployable services organized around business capabilities, communicating over lightweight protocols, with decentralized data management and independent scaling.` },

{ cat:"System Design", tag:"tag-micro", q:"150. How do microservices communicate with each other?",
  ans:`They communicate via APIs, typically REST/JSON over HTTP, gRPC, or messaging systems like Kafka/RabbitMQ. Use synchronous calls for request/response and asynchronous messaging for loose coupling and resilience.` },

{ cat:"System Design", tag:"tag-micro", q:"151. What is service discovery and why is it needed?",
  ans:`Service discovery tracks available service instances and routes calls to healthy targets. It is needed because instances scale dynamically and clients should not hard-code service addresses.` },

{ cat:"System Design", tag:"tag-micro", q:"152. What is an API Gateway and what problems does it solve?",
  ans:`An API Gateway is a single entry point for external clients. It handles routing, authentication, rate limiting, request aggregation, and protocol translation between clients and microservices.` },

{ cat:"System Design", tag:"tag-micro", q:"153. How do you manage transactions across microservices?",
  ans:`Use eventual consistency patterns like Sagas, compensating transactions, or orchestration/choreography instead of distributed two-phase commit. Design services to own local transactions and coordinate state through events.` },

{ cat:"System Design", tag:"tag-micro", q:"154. What are the advantages of containerization in microservices?",
  ans:`Containers provide lightweight packaging, consistent runtime environments, and isolation. They simplify deployment, scaling, and platform portability for microservices.` },

{ cat:"System Design", tag:"tag-micro", q:"155. What are some common microservices anti-patterns?",
  ans:`Common anti-patterns include database per service without clear ownership, chatty synchronous communication, distributed monoliths, and unbounded distributed transactions that hurt reliability and performance.` },

{ cat:"System Design", tag:"tag-micro", q:"156. How do you handle versioning in microservice APIs?",
  ans:`Use versioned endpoints or content negotiation, maintain backward compatibility, and deploy new versions alongside old ones. Use clear deprecation policies and communicate changes to clients.` },

{ cat:"System Design", tag:"tag-micro", q:"157. What is circuit breaker in microservices and why use it?",
  ans:`A circuit breaker prevents repeated calls to failing services by temporarily opening after errors exceed thresholds. It improves resilience by failing fast and allowing downstream recovery without cascading failures.` },

{ cat:"System Design", tag:"tag-micro", q:"158. How do you implement distributed tracing?",
  ans:`Propagate trace IDs through service calls, capture spans in each service, and send traces to a system like Jaeger or Zipkin. Use instrumentation libraries and consistent headers for end-to-end visibility.` },

{ cat:"System Design", tag:"tag-micro", q:"159. How do you handle config management for many microservices?",
  ans:`Use centralized configuration management like Spring Cloud Config, Consul, or Kubernetes ConfigMaps/Secrets. Keep common settings in a shared store, support overrides per environment, and secure sensitive values.` },

// Algorithms (160-172)
{ cat:"System Design", tag:"tag-algo", q:"160. What is time complexity and why does it matter?",
  ans:`Time complexity describes how algorithm runtime grows with input size. It matters because it predicts scalability and helps compare solutions for performance under large data volumes.` },

{ cat:"System Design", tag:"tag-algo", q:"161. What is the difference between O(n) and O(n^2)?",
  ans:`O(n) grows linearly with input size, while O(n^2) grows quadratically. O(n^2) becomes much slower than O(n) for large inputs, so linear algorithms scale better.` },

{ cat:"System Design", tag:"tag-algo", q:"162. How do you choose a data structure for a problem?",
  ans:`Choose based on operations needed: arrays for indexed access, lists for dynamic insertion, maps for lookups, sets for uniqueness, queues/stacks for ordering, and trees/graphs for hierarchical or relationship data.` },

{ cat:"System Design", tag:"tag-algo", q:"163. What is a stack and when do you use it?",
  ans:`A stack is LIFO (last-in, first-out). Use it for recursion simulation, expression evaluation, parsing, backtracking, and undo functionality.` },

{ cat:"System Design", tag:"tag-algo", q:"164. What is a queue and when is it useful?",
  ans:`A queue is FIFO (first-in, first-out). Use it for task scheduling, breadth-first search, producer-consumer workflows, and buffering asynchronous events.` },

{ cat:"System Design", tag:"tag-algo", q:"165. What is the difference between ArrayList and LinkedList?",
  ans:`ArrayList has fast random access and uses contiguous memory, but insertions/removals in the middle are slower. LinkedList has constant-time insert/remove at ends or known positions but slower random access due to traversal.` },

{ cat:"System Design", tag:"tag-algo", q:"166. What is binary search and what requirement does it have?",
  ans:`Binary search divides a sorted array in half repeatedly to find a value in O(log n). It requires a sorted collection and direct indexing access.` },

{ cat:"System Design", tag:"tag-algo", q:"167. Describe merge sort and its complexity.",
  ans:`Merge sort recursively divides the array, sorts halves, and merges them. It has O(n log n) time complexity and stable behavior, with O(n) extra space for merging.` },

{ cat:"System Design", tag:"tag-algo", q:"168. What is a hash table and when is it useful?",
  ans:`A hash table maps keys to values using a hash function for near-constant average-time lookup, insert, and delete. It is useful for fast membership tests and dictionary-style access.` },

{ cat:"System Design", tag:"tag-algo", q:"169. What is dynamic programming?",
  ans:`Dynamic programming solves problems by breaking them into overlapping subproblems and caching results. Use it when a problem has optimal substructure and repeated computations.` },

{ cat:"System Design", tag:"tag-algo", q:"170. How do you detect cycles in a graph?",
  ans:`Use DFS with recursion stack tracking for directed graphs or union-find for undirected graphs. A back-edge in DFS indicates a cycle in directed graphs.` },

{ cat:"System Design", tag:"tag-algo", q:"171. How do you find the shortest path in a weighted graph?",
  ans:`Use Dijkstra's algorithm for non-negative weights or Bellman-Ford when negative weights are present. For all-pairs shortest path use Floyd-Warshall.` },

{ cat:"System Design", tag:"tag-algo", q:"172. What is Big O notation versus Big Omega?",
  ans:`Big O describes an upper bound on growth (worst-case or asymptotic limit). Big Omega describes a lower bound (best-case or asymptotic minimum).` },

// SQL & Database (173-182)
{ cat:"Database & SQL", tag:"tag-db", q:"173. What is normalization and why is it used?",
  ans:`Normalization organizes data into tables to reduce redundancy and improve integrity. It makes updates easier and prevents anomalies by enforcing relationships between tables.` },

{ cat:"Database & SQL", tag:"tag-db", q:"174. What are ACID properties?",
  ans:`ACID stands for Atomicity, Consistency, Isolation, Durability. Together they ensure reliable transaction processing and data integrity in databases.` },

{ cat:"Database & SQL", tag:"tag-db", q:"175. What is the difference between SQL and NoSQL?",
  ans:`SQL databases are relational and schema-based, ideal for structured data and complex joins. NoSQL databases are schema-flexible and built for scalability, often using key-value, document, column, or graph models.` },

{ cat:"Database & SQL", tag:"tag-db", q:"176. What is an index and how does it improve query performance?",
  ans:`An index is a data structure that allows fast lookup of rows by key values, much like a book index. It reduces full-table scans and speeds up searches, but adds overhead for writes and storage.` },

{ cat:"Database & SQL", tag:"tag-db", q:"177. What is a JOIN and what types are common?",
  ans:`JOIN combines rows from two tables based on related columns. Common types are INNER JOIN, LEFT JOIN, RIGHT JOIN, and FULL OUTER JOIN for different matching semantics.` },

{ cat:"Database & SQL", tag:"tag-db", q:"178. How do you prevent SQL injection?",
  ans:`Use prepared statements or parameterized queries, avoid string concatenation with user input, and validate or escape inputs when necessary. ORM frameworks also help if used correctly.` },

{ cat:"Database & SQL", tag:"tag-db", q:"179. What is a transaction isolation level?",
  ans:`Isolation levels control visibility of concurrent transactions and the phenomena they can see: READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, and SERIALIZABLE. Higher isolation reduces anomalies but may reduce concurrency.` },

{ cat:"Database & SQL", tag:"tag-db", q:"180. How does indexing affect inserts and updates?",
  ans:`Indexes speed reads but slow inserts and updates because the index structures must also be maintained. Use indexes selectively on frequently searched columns, not every field.` },

{ cat:"Database & SQL", tag:"tag-db", q:"181. What is denormalization and when is it appropriate?",
  ans:`Denormalization intentionally duplicates data to improve read performance or simplify queries. It is appropriate when read speed matters more than write complexity and you can manage consistency.
` },

{ cat:"Database & SQL", tag:"tag-db", q:"182. What is a database transaction log?",
  ans:`A transaction log records all changes to the database to support recovery, rollback, and replication. It ensures durability and enables the database to restore a consistent state after crashes.` }];

// ─── CONFIG ─────────────────────────────────────────
const CATS = ["All", ...new Set(Q.map(q => q.cat))];
const CAT_COLORS = {
  "Core Java":     "#4fc3f7", "JVM Memory": "#c792ea", "Concurrency": "#ffb347",
  "Streams & FP":  "#64ffda", "Spring Boot": "#a8ff78", "JPA / Hibernate": "#f78fb3",
  "System Design": "#ff6b6b", "Database & SQL": "#ffd166", "Design Patterns": "#c3e88d",
  "REST & Security":"#f78fb3"
};
const CAT_DOT = {
  "Core Java":"#4fc3f7","JVM Memory":"#c792ea","Concurrency":"#ffb347",
  "Streams & FP":"#64ffda","Spring Boot":"#a8ff78","JPA / Hibernate":"#f78fb3",
  "System Design":"#ff6b6b","Database & SQL":"#ffd166","Design Patterns":"#c3e88d",
  "REST & Security":"#f78fb3"
};

let activeCat = "All", openId = null;

// ─── TABS ───────────────────────────────────────────
function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = CATS.map(c => {
    const active = c === activeCat;
    return `<button class="tab${active?" active":""}" onclick="setTab('${c.replace(/'/g,"\\'")}')">${c}</button>`;
  }).join("");
}
function setTab(c) { activeCat = c; openId = null; render(); }

// ─── FILTER ─────────────────────────────────────────
function filtered() {
  const search = (document.getElementById("search").value || "").toLowerCase();
  return Q.filter(q => {
    const catOk = activeCat === "All" || q.cat === activeCat;
    const qOk = !search || q.q.toLowerCase().includes(search) || q.cat.toLowerCase().includes(search) || (q.ans||"").toLowerCase().includes(search);
    return catOk && qOk;
  });
}

// ─── RENDER ─────────────────────────────────────────
function toggle(id) { openId = openId === id ? null : id; render(); }

function render() {
  renderTabs();
  const list = filtered();
  document.getElementById("cnt").textContent = list.length + " questions";

  const byCat = {};
  list.forEach(q => { (byCat[q.cat] = byCat[q.cat] || []).push(q); });

  const main = document.getElementById("main");
  if (!list.length) { main.innerHTML = '<div class="empty">No questions match. Try a different search.</div>'; return; }

  let num = 0;
  main.innerHTML = Object.entries(byCat).map(([cat, qs]) => {
    const color = CAT_DOT[cat] || "#8892b0";
    const cards = qs.map(q => {
      num++;
      const n = num;
      const isOpen = openId === q.q;
      return `<div class="qcard${isOpen?" open":""}">
        <div class="qhead" onclick='toggle(${JSON.stringify(q.q)})'>
          <span class="qnum">${String(n).padStart(2,"0")}</span>
          <span class="qtitle">${q.q}</span>
          <span class="qcat ${q.tag}" style="">${q.cat}</span>
          <span class="arrow">▼</span>
        </div>
        ${isOpen ? `<div class="qbody">
          ${q.ans ? `<div class="ans">${q.ans}</div>` : ""}
          ${q.code ? `<hr class="divider"><pre>${escHtml(q.code)}</pre>` : ""}
        </div>` : ""}
      </div>`;
    }).join("");

    return `<div class="section-header">
      <span class="section-dot" style="background:${color}"></span>
      <h2>${cat}</h2>
      <span style="font-size:12px;color:#8892b0">${qs.length} questions</span>
    </div>${cards}`;
  }).join("");
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

render();
</script>
